<!-- MODULE: HoiThao.html -->
<div id="hoiThaoContainer" class="w-full max-w-2xl mx-auto p-4">
  <div id="formContainer" class="w-full mx-auto glass border border-white/10 rounded-3xl p-4 sm:p-6 shadow-2xl">
    <form id="hoiThaoForm" novalidate>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="hoTen" class="block text-xs font-medium mb-1 text-slate-400">Họ và tên</label>
          <input type="text" id="hoTen" name="hoTen" readonly class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none cursor-not-allowed">
        </div>
        <div>
          <label for="toChuyenMon" class="block text-xs font-medium mb-1 text-slate-400">Tổ chuyên môn</label>
          <input type="text" id="toChuyenMon" name="toChuyenMon" readonly class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none cursor-not-allowed">
        </div>
      </div>

      <div class="mt-4">
        <label for="chucVu" class="block text-xs font-medium mb-1 text-slate-400">Chức vụ</label>
        <input type="text" id="chucVu" name="chucVu" readonly class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none cursor-not-allowed">
      </div>

      <div class="mt-4">
        <label for="tenHoiThao" class="block text-xs font-medium mb-1 text-slate-400">Tên hội thảo <span class="text-red-400">*</span></label>
        <input type="text" id="tenHoiThao" name="tenHoiThao" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500" required>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label for="donViToChuc" class="block text-xs font-medium mb-1 text-slate-400">Đơn vị tổ chức <span class="text-red-400">*</span></label>
          <input type="text" id="donViToChuc" name="donViToChuc" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500" required>
        </div>
        <div>
          <label for="capToChuc" class="block text-xs font-medium mb-1 text-slate-400">Cấp tổ chức</label>
          <select id="capToChuc" name="capToChuc" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500">
            <option value="Bo GDĐT">Bộ GDĐT</option>
            <option value="So GDĐT">Sở GDĐT</option>
            <option value="Cum">Cụm</option>
            <option value="Truong">Trường</option>
            <option value="Khac">Khác</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label for="hinhThuc" class="block text-xs font-medium mb-1 text-slate-400">Hình thức</label>
          <select id="hinhThuc" name="hinhThuc" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500">
            <option value="Trực tiếp">Trực tiếp</option>
            <option value="Trực tuyến">Trực tuyến</option>
            <option value="Kết hợp">Kết hợp</option>
          </select>
        </div>
        <div>
          <label for="thoiGian" class="block text-xs font-medium mb-1 text-slate-400">Thời gian <span class="text-red-400">*</span></label>
          <input type="datetime-local" id="thoiGian" name="thoiGian" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500" required>
        </div>
      </div>

      <div class="mt-4">
        <label for="diaDiem" class="block text-xs font-medium mb-1 text-slate-400">Địa điểm</label>
        <input type="text" id="diaDiem" name="diaDiem" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500">
      </div>

      <div class="mt-4">
        <label for="noiDungChinh" class="block text-xs font-medium mb-1 text-slate-400">Nội dung chính <span class="text-red-400">*</span></label>
        <textarea id="noiDungChinh" name="noiDungChinh" rows="4" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500" required></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label for="ketQua" class="block text-xs font-medium mb-1 text-slate-400">Kết quả đạt được</label>
          <textarea id="ketQua" name="ketQua" rows="3" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500"></textarea>
        </div>
        <div>
          <label for="deXuat" class="block text-xs font-medium mb-1 text-slate-400">Đề xuất</label>
          <textarea id="deXuat" name="deXuat" rows="3" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500"></textarea>
        </div>
      </div>

      <div class="mt-4">
        <label for="minhChung" class="block text-xs font-medium mb-1 text-slate-400">Link minh chứng</label>
        <input type="url" id="minhChung" name="minhChung" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500" placeholder="https://...">
      </div>

      <div class="mt-4">
        <label for="ghiChu" class="block text-xs font-medium mb-1 text-slate-400">Ghi chú</label>
        <textarea id="ghiChu" name="ghiChu" rows="2" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500"></textarea>
      </div>

     <div class="flex gap-3 mt-8">

    <button type="button"
        id="btnReset"
        class="flex-1 py-3.5 border border-white/30 hover:bg-white/10 rounded-2xl font-medium transition-all">
        Làm mới
    </button>

    <button type="button"
        id="btnPreview"
        class="flex-1 py-3.5 bg-sky-600 hover:bg-sky-500 rounded-2xl font-semibold transition-all">
        👁 Xem trước
    </button>

    <button type="submit"
        id="btnSubmit"
        class="flex-1 py-3.5 bg-teal-600 hover:bg-teal-500 rounded-2xl font-semibold transition-all flex items-center justify-center gap-2 disabled:opacity-70">
        <span id="btnText">📤 Gửi báo cáo</span>
    </button>

</div>
<!-- ================= PREVIEW MODAL ================= -->
<div id="previewModal"
     class="fixed inset-0 hidden z-[9999] bg-black/60 backdrop-blur-sm flex items-center justify-center p-6">

    <div class="bg-white rounded-xl shadow-2xl w-[90%] h-[90%] flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="px-6 py-4 border-b flex items-center justify-between">

            <h2 class="text-xl font-bold text-gray-800">
                👁 Xem trước báo cáo
            </h2>

            <button id="btnClosePreview"
                    class="text-3xl text-gray-500 hover:text-red-600">
                ×
            </button>

        </div>

        <!-- Khổ giấy A4 -->
        <div class="flex-1 overflow-auto bg-gray-300 p-8">

            <div id="previewPaper"
                 class="mx-auto bg-white shadow-xl"
                 style="
                     width:210mm;
                     min-height:297mm;
                     padding:25mm;
                     font-family:'Times New Roman', serif;
                     font-size:14pt;
                     line-height:1.5;
                 ">

            </div>

        </div>

        <!-- Footer -->
        <div class="border-t px-6 py-4 flex justify-end gap-3">

            <button id="btnBackForm"
                class="px-5 py-2 rounded-lg border">
                ✏ Quay lại
            </button>

            <button id="btnConfirmSubmit"
                class="px-6 py-2 rounded-lg bg-teal-600 text-white">
                📤 Xác nhận gửi
            </button>

        </div>

    </div>

</div>
<script>
  (() => {
    // ====================== CONFIG ======================
    const CONFIG = {
      SHEET_NAME: "HoiThao",
      ACTION: "saveHoiThao"
    };

    // ====================== STATE ======================
    const STATE = {
      currentUser: null,
      isSaving: false
    };

   // ====================== DOM CACHE ======================
const DOM = {
  container: document.getElementById('hoiThaoContainer'),
  form: document.getElementById('hoiThaoForm'),

  btnSubmit: document.getElementById('btnSubmit'),
  btnText: document.getElementById('btnText'),
  btnReset: document.getElementById('btnReset'),

  // ===== Preview =====
  btnPreview: document.getElementById('btnPreview'),
  previewModal: document.getElementById('previewModal'),
  previewPaper: document.getElementById('previewPaper'),
  btnClosePreview: document.getElementById('btnClosePreview'),
  btnBackForm: document.getElementById('btnBackForm'),
  btnConfirmSubmit: document.getElementById('btnConfirmSubmit'),

  hoTen: document.getElementById('hoTen'),
  toChuyenMon: document.getElementById('toChuyenMon'),
  chucVu: document.getElementById('chucVu'),
  tenHoiThao: document.getElementById('tenHoiThao'),
  donViToChuc: document.getElementById('donViToChuc'),
  capToChuc: document.getElementById('capToChuc'),
  hinhThuc: document.getElementById('hinhThuc'),
  thoiGian: document.getElementById('thoiGian'),
  diaDiem: document.getElementById('diaDiem'),
  noiDungChinh: document.getElementById('noiDungChinh'),
  ketQua: document.getElementById('ketQua'),
  deXuat: document.getElementById('deXuat'),
  minhChung: document.getElementById('minhChung'),
  ghiChu: document.getElementById('ghiChu')
};

    // ====================== UTILS ======================
    const UTILS = {
      getCurrentUser: function() {
        if (typeof window.getCurrentUser === 'function') {
          return window.getCurrentUser();
        }
        try {
          const user = JSON.parse(localStorage.getItem("user")) || {};
          return {
            name: user.name || user.fullName || "",
            department: user.department || user.toChuyenMon || "",
            position: user.position || user.chucVu || user.workPosition || ""
          };
        } catch (e) {
          console.error("Lỗi lấy user:", e);
          return { name: "", department: "", position: "" };
        }
      },
      showToast: function(message, type = 'success') {
        if (typeof window.showToast === 'function') {
          window.showToast(message, type);
        } else {
          console.log(`[Toast ${type}]: ${message}`);
        }
      },
      showLoading: function(show) {
        if (typeof window.showLoading === 'function') {
          window.showLoading(show);
        }
      }
    };

    // ====================== API ======================
    const API = {
      saveHoiThao: async function(payload) {
        if (window.API && typeof window.API.saveHoiThao === 'function') {
          return await window.API.saveHoiThao(payload);
        }
        if (window.API && typeof window.API.request === 'function') {
          return await window.API.request({
            action: CONFIG.ACTION,
            sheetName: CONFIG.SHEET_NAME,
            payload: payload
          });
        }
        const endpoint = (window.CONFIG && window.CONFIG.API_URL) ? window.CONFIG.API_URL : '';
        if (!endpoint) {
          throw new Error("Chưa cấu hình API endpoint hệ thống");
        }
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: CONFIG.ACTION,
            sheetName: CONFIG.SHEET_NAME,
            payload: payload
          })
        });
        return await response.json();
      }
    };

    // ====================== UI ======================
   
const UI = {

  updateUserInfo: function () {
    STATE.currentUser = UTILS.getCurrentUser();
    DOM.hoTen.value = STATE.currentUser.name || '';
    DOM.toChuyenMon.value = STATE.currentUser.department || '';
    DOM.chucVu.value = STATE.currentUser.position || '';
  },

  setSubmittingState: function (isSubmitting) {
    STATE.isSaving = isSubmitting;
    UTILS.showLoading(isSubmitting);
    DOM.btnSubmit.disabled = isSubmitting;

    if (isSubmitting) {
      DOM.btnText.innerHTML = `<i class="bi bi-hourglass-split animate-spin"></i> Đang lưu...`;
    } else {
      DOM.btnText.textContent = '📤 Gửi báo cáo';
    }
  },

  // ===== PREVIEW =====
  openPreview: function () {
    DOM.previewModal.classList.remove('hidden');
  },

  closePreview: function () {
    DOM.previewModal.classList.add('hidden');
  }

};
    // ====================== VALIDATION ======================
    const VALIDATION = {
      isValid: function() {
        if (!DOM.tenHoiThao.value.trim()) {
          UTILS.showToast("Vui lòng nhập Tên hội thảo", 'warning');
          DOM.tenHoiThao.focus();
          return false;
        }
        if (!DOM.donViToChuc.value.trim()) {
          UTILS.showToast("Vui lòng nhập Đơn vị tổ chức", 'warning');
          DOM.donViToChuc.focus();
          return false;
        }
        if (!DOM.thoiGian.value) {
          UTILS.showToast("Vui lòng chọn Thời gian", 'warning');
          DOM.thoiGian.focus();
          return false;
        }
        if (!DOM.noiDungChinh.value.trim()) {
          UTILS.showToast("Vui lòng nhập Nội dung chính", 'warning');
          DOM.noiDungChinh.focus();
          return false;
        }
        return true;
      }
    };

    // ====================== FORM ======================
    const FORM = {
      collectData: function() {
        return {
          hoTen: DOM.hoTen.value,
          toChuyenMon: DOM.toChuyenMon.value,
          chucVu: DOM.chucVu.value,
          tenHoiThao: DOM.tenHoiThao.value.trim(),
          donViToChuc: DOM.donViToChuc.value.trim(),
          capToChuc: DOM.capToChuc.value,
          hinhThuc: DOM.hinhThuc.value,
          thoiGian: DOM.thoiGian.value,
          diaDiem: DOM.diaDiem.value.trim(),
          noiDungChinh: DOM.noiDungChinh.value.trim(),
          ketQua: DOM.ketQua.value.trim(),
          deXuat: DOM.deXuat.value.trim(),
          minhChung: DOM.minhChung.value.trim(),
          ghiChu: DOM.ghiChu.value.trim()
        };
      },
      reset: function() {
        DOM.form.reset();
        UI.updateUserInfo();
        DOM.tenHoiThao.focus();
      }
    };

   // ====================== INIT ======================
function init() {

  UI.updateUserInfo();

  // ===== RESET =====
  DOM.btnReset.addEventListener('click', function () {
    FORM.reset();
  });

  // ===== PREVIEW =====
  DOM.btnPreview.addEventListener('click', function () {
    UI.openPreview();
  });

  DOM.btnClosePreview.addEventListener('click', function () {
    UI.closePreview();
  });

  DOM.btnBackForm.addEventListener('click', function () {
    UI.closePreview();
  });

  // ===== SUBMIT =====
  DOM.form.addEventListener('submit', async function (e) {

    e.preventDefault();

    if (STATE.isSaving) return;

    if (!VALIDATION.isValid()) return;

    UI.setSubmittingState(true);

    const data = FORM.collectData();

    try {

      const result = await API.saveHoiThao(data);

      if (result && (result.success || result.status === 'success')) {

        UTILS.showToast(
          result.message || "Lưu báo cáo thành công!",
          'success'
        );

        FORM.reset();

      } else {

        UTILS.showToast(
          (result && result.message)
            ? result.message
            : "Có lỗi xảy ra khi lưu!",
          'error'
        );

      }

    } catch (error) {

      UTILS.showToast(
        "Lỗi khi lưu: " + (error.message || error),
        'error'
      );

    } finally {

      UI.setSubmittingState(false);

    }

  });

}

init();
  })();
</script>
