<!-- MODULE CHUẨN ĐÃ FIX LỖI TOAST: HoiThao.html -->
<div id="hoiThaoContainer" class="fixed inset-0 z-[9999] bg-slate-50 flex flex-col overflow-hidden text-slate-800">
  
  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shadow-sm shrink-0">
    <div class="flex items-center gap-3">
      <button type="button" id="btnBackHeader" class="p-2 -ml-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center justify-center cursor-pointer">
        <i class="bi bi-arrow-left text-2xl"></i>
      </button>
      <div>
        <h3 class="font-bold text-slate-800 text-lg leading-tight">Báo cáo Hội thảo</h3>
        <p class="text-xs text-slate-500">Cập nhật nội dung & thông tin hội thảo</p>
      </div>
    </div>
    <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-semibold text-sm">
      <i class="bi bi-chat-text-fill text-lg"></i>
    </div>
  </header>

  <!-- BODY -->
  <main class="flex-1 overflow-y-auto p-4 sm:p-6">
    <div class="max-w-3xl mx-auto w-full pb-10">
      <form id="hoiThaoForm" novalidate class="space-y-4">
        
        <!-- Thông tin cá nhân -->
        <div class="bg-slate-100/90 p-4 rounded-2xl border border-slate-200/80 space-y-3 shadow-sm">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Họ và tên</label>
              <input type="text" id="hoTen" name="hoTen" readonly class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 cursor-not-allowed">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Tổ chuyên môn</label>
              <input type="text" id="toChuyenMon" name="toChuyenMon" readonly class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 cursor-not-allowed">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Chức vụ</label>
            <input type="text" id="chucVu" name="chucVu" readonly class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 cursor-not-allowed">
          </div>
        </div>

        <!-- Chi tiết hội thảo -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
          <div>
            <label for="tenHoiThao" class="block text-xs font-bold text-slate-700 mb-1">Tên hội thảo <span class="text-red-500">*</span></label>
            <input type="text" id="tenHoiThao" name="tenHoiThao" required placeholder="Nhập tên hội thảo..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="donViToChuc" class="block text-xs font-bold text-slate-700 mb-1">Đơn vị tổ chức <span class="text-red-500">*</span></label>
              <input type="text" id="donViToChuc" name="donViToChuc" required placeholder="Ví dụ: Trường THPT..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
            </div>
            <div>
              <label for="capToChuc" class="block text-xs font-bold text-slate-700 mb-1">Cấp tổ chức</label>
              <select id="capToChuc" name="capToChuc" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
                <option value="Bộ GDĐT">Bộ GDĐT</option>
                <option value="Sở GDĐT">Sở GDĐT</option>
                <option value="Cụm">Cụm</option>
                <option value="Trường">Trường</option>
                <option value="Khác">Khác</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="hinhThuc" class="block text-xs font-bold text-slate-700 mb-1">Hình thức</label>
              <select id="hinhThuc" name="hinhThuc" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
                <option value="Trực tiếp">Trực tiếp</option>
                <option value="Trực tuyến">Trực tuyến</option>
                <option value="Kết hợp">Kết hợp</option>
              </select>
            </div>
            <div>
              <label for="thoiGian" class="block text-xs font-bold text-slate-700 mb-1">Thời gian <span class="text-red-500">*</span></label>
              <input type="datetime-local" id="thoiGian" name="thoiGian" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
            </div>
          </div>

          <div>
            <label for="diaDiem" class="block text-xs font-bold text-slate-700 mb-1">Địa điểm</label>
            <input type="text" id="diaDiem" name="diaDiem" placeholder="Địa điểm tổ chức..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
          </div>

          <div>
            <label for="noiDungChinh" class="block text-xs font-bold text-slate-700 mb-1">Nội dung chính <span class="text-red-500">*</span></label>
            <textarea id="noiDungChinh" name="noiDungChinh" rows="3" required placeholder="Tóm tắt nội dung chính..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="ketQua" class="block text-xs font-bold text-slate-700 mb-1">Kết quả đạt được</label>
              <textarea id="ketQua" name="ketQua" rows="3" placeholder="Kết quả nổi bật..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"></textarea>
            </div>
            <div>
              <label for="deXuat" class="block text-xs font-bold text-slate-700 mb-1">Đề xuất</label>
              <textarea id="deXuat" name="deXuat" rows="3" placeholder="Ý kiến đề xuất..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"></textarea>
            </div>
          </div>

          <div>
            <label for="minhChung" class="block text-xs font-bold text-slate-700 mb-1">Link minh chứng</label>
            <input type="url" id="minhChung" name="minhChung" placeholder="https://drive.google.com/..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
          </div>

          <div>
            <label for="ghiChu" class="block text-xs font-bold text-slate-700 mb-1">Ghi chú</label>
            <textarea id="ghiChu" name="ghiChu" rows="2" placeholder="Ghi chú thêm..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"></textarea>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button type="button" id="btnReset" class="flex-1 py-3 px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition-all text-sm cursor-pointer">
            Làm mới
          </button>
          <button type="button" id="btnPreview" class="flex-1 py-3 px-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl transition-all text-sm flex items-center justify-center gap-1.5 shadow-md shadow-sky-600/20 cursor-pointer">
            <span>👁 Xem trước</span>
          </button>
          <button type="submit" id="btnSubmit" class="flex-1 py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl transition-all text-sm flex items-center justify-center gap-1.5 shadow-md shadow-emerald-700/20 cursor-pointer">
            <span id="btnText">📤 Gửi báo cáo</span>
          </button>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- MODAL PREVIEW -->
<div id="previewModal" class="fixed inset-0 hidden z-[99999] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[90vh] flex flex-col overflow-hidden">
    <div class="px-6 py-4 border-b flex items-center justify-between bg-slate-50 shrink-0">
      <h2 class="text-xl font-bold text-slate-800">👁 Xem trước báo cáo</h2>
      <button id="btnClosePreview" type="button" class="text-3xl text-slate-400 hover:text-red-600 transition-colors cursor-pointer">&times;</button>
    </div>
    
    <div class="flex-1 overflow-auto bg-slate-200 p-4 sm:p-6">
      <div id="previewPaper" class="mx-auto bg-white shadow-xl"></div>
    </div>

    <div class="border-t px-6 py-4 flex justify-end gap-3 bg-slate-50 shrink-0">
      <button id="btnBackForm" type="button" class="px-5 py-2.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 font-medium text-slate-700 transition-all cursor-pointer">
        ✏ Quay lại chỉnh sửa
      </button>
      <button id="btnConfirmSubmit" type="button" class="px-6 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold shadow-md transition-all flex items-center gap-2 cursor-pointer">
        📤 Xác nhận gửi
      </button>
    </div>
  </div>
</div>

<script>
  function closeHoiThaoModal() {
    const container = document.getElementById('hoiThaoContainer');
    if (container) {
      container.style.display = 'none'; // Ẩn module đi thay vì xóa hẳn để tránh trắng màn hình
    }
    if (typeof window.closeModal === 'function') {
      window.closeModal('hoiThaoContainer');
    }
    if (typeof window.showMainView === 'function') {
      window.showMainView();
    }
  }

  (() => {
    const DOM = {
      btnBackHeader: document.getElementById('btnBackHeader'),
      form: document.getElementById('hoiThaoForm'),
      btnReset: document.getElementById('btnReset'),
      btnPreview: document.getElementById('btnPreview'),
      btnSubmit: document.getElementById('btnSubmit'),
      btnText: document.getElementById('btnText'),
      
      previewModal: document.getElementById('previewModal'),
      btnClosePreview: document.getElementById('btnClosePreview'),
      btnBackForm: document.getElementById('btnBackForm'),
      btnConfirmSubmit: document.getElementById('btnConfirmSubmit'),
      previewPaper: document.getElementById('previewPaper'),
      
      hoTen: document.getElementById('hoTen'),
      toChuyenMon: document.getElementById('toChuyenMon'),
      chucVu: document.getElementById('chucVu'),
      tenHoiThao: document.getElementById('tenHoiThao'),
      donViToChuc: document.getElementById('donViToChuc'),
      capToChuc: document.getElementById('capToChuc'),
      hinhThuc: document.getElementById('hinhThuc'),
      thoiGian: document.getElementById('thoiGian'),
      diaDiem: document.getElementById('diaDiem'),
      noiDungChinh: document.getElementById('noiDungChinh'),
      ketQua: document.getElementById('ketQua'),
      deXuat: document.getElementById('deXuat'),
      minhChung: document.getElementById('minhChung'),
      ghiChu: document.getElementById('ghiChu')
    };

    // Hàm thông báo độc lập, không bị phụ thuộc vào hàm thiếu của trang chủ
    function showAlert(msg) {
      alert(msg);
    }

    function initUser() {
      let user = {};
      try {
        if (typeof window.getCurrentUser === 'function') {
          user = window.getCurrentUser() || {};
        } else {
          user = JSON.parse(localStorage.getItem("user")) || {};
        }
      } catch (e) {}
      
      if (DOM.hoTen) DOM.hoTen.value = user.name || user.fullName || "Hoàng Châu Âu";
      if (DOM.toChuyenMon) DOM.toChuyenMon.value = user.department || user.toChuyenMon || "Vật lí - Công nghệ";
      if (DOM.chucVu) DOM.chucVu.value = user.position || user.chucVu || "TPCM";
    }

    function validateForm() {
      if (!DOM.tenHoiThao.value.trim()) {
        showAlert("Vui lòng nhập Tên hội thảo!");
        DOM.tenHoiThao.focus();
        return false;
      }
      if (!DOM.donViToChuc.value.trim()) {
        showAlert("Vui lòng nhập Đơn vị tổ chức!");
        DOM.donViToChuc.focus();
        return false;
      }
      if (!DOM.thoiGian.value) {
        showAlert("Vui lòng chọn Thời gian hội thảo!");
        DOM.thoiGian.focus();
        return false;
      }
      if (!DOM.noiDungChinh.value.trim()) {
        showAlert("Vui lòng nhập Nội dung chính!");
        DOM.noiDungChinh.focus();
        return false;
      }
      return true;
    }

    function openPreviewModal() {
      if (!validateForm()) return;
      
      const now = new Date();
      const ngayThangNam = `Đà Nẵng, ngày ${now.getDate()} tháng ${now.getMonth() + 1} năm ${now.getFullYear()}`;
      
      let thoiGianVal = DOM.thoiGian.value;
      if (thoiGianVal) {
        const d = new Date(thoiGianVal);
        if (!isNaN(d.getTime())) {
          thoiGianVal = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ngày ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }
      }

      DOM.previewPaper.innerHTML = `
        <div style="width: 100%; max-width: 794px; min-height: 1000px; background: #fff; font-family: 'Times New Roman', Times, serif; padding: 40px 50px; margin: 0 auto; color: #111; font-size: 13pt; line-height: 1.5;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <div style="text-align: center;">
              <b>TRƯỜNG THPT HÒA VANG</b><br>
              <span style="font-size: 10pt;">TRUNG TÂM ĐIỀU HÀNH SỐ</span>
            </div>
            <div style="text-align: right; font-size: 10pt; font-style: italic;">
              Thời gian lập: ${now.toLocaleTimeString('vi-VN')}
            </div>
          </div>
          
          <div style="text-align: center; margin-bottom: 25px;">
            <b style="font-size: 15pt; text-transform: uppercase;">BÁO CÁO THAM DỰ HỘI THẢO</b>
          </div>

          <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px;">
            <tr><td style="width: 140px; padding: 4px 0;"><b>Họ và tên:</b></td><td style="padding: 4px 0;"><b>${DOM.hoTen.value}</b></td></tr>
            <tr><td style="padding: 4px 0;"><b>Tổ chuyên môn:</b></td><td style="padding: 4px 0;">${DOM.toChuyenMon.value}</td></tr>
            <tr><td style="padding: 4px 0;"><b>Chức vụ:</b></td><td style="padding: 4px 0;">${DOM.chucVu.value}</td></tr>
            <tr><td style="padding: 4px 0;"><b>Tên hội thảo:</b></td><td style="padding: 4px 0;">${DOM.tenHoiThao.value}</td></tr>
            <tr><td style="padding: 4px 0;"><b>Đơn vị tổ chức:</b></td><td style="padding: 4px 0;">${DOM.donViToChuc.value} (${DOM.capToChuc.value})</td></tr>
            <tr><td style="padding: 4px 0;"><b>Hình thức:</b></td><td style="padding: 4px 0;">${DOM.hinhThuc.value}</td></tr>
            <tr><td style="padding: 4px 0;"><b>Thời gian:</b></td><td style="padding: 4px 0;">${thoiGianVal}</td></tr>
            <tr><td style="padding: 4px 0;"><b>Địa điểm:</b></td><td style="padding: 4px 0;">${DOM.diaDiem.value || 'Không có'}</td></tr>
          </table>

          <div style="margin-top: 15px;">
            <b>I. Nội dung chính:</b>
            <div style="padding-left: 10px; white-space: pre-wrap;">${DOM.noiDungChinh.value}</div>
            
            <b style="display: block; margin-top: 10px;">II. Kết quả đạt được:</b>
            <div style="padding-left: 10px; white-space: pre-wrap;">${DOM.ketQua.value || 'Không có'}</div>

            <b style="display: block; margin-top: 10px;">III. Đề xuất:</b>
            <div style="padding-left: 10px; white-space: pre-wrap;">${DOM.deXuat.value || 'Không có'}</div>

            <b style="display: block; margin-top: 10px;">IV. Minh chứng:</b>
            <div style="padding-left: 10px;">${DOM.minhChung.value ? `<a href="${DOM.minhChung.value}" target="_blank" style="color:#0284c7;">${DOM.minhChung.value}</a>` : 'Không có'}</div>

            <b style="display: block; margin-top: 10px;">Ghi chú:</b>
            <div style="padding-left: 10px;">${DOM.ghiChu.value || 'Không có'}</div>
          </div>

         <div style="display: flex; justify-content: flex-end; margin-top: 30px;">
            <div style="text-align: center; width: 240px;">
              <i style="white-space: nowrap;">${ngayThangNam}</i><br>
              <b>Người báo cáo</b><br>
              <i style="font-size: 10pt;">(Ký, ghi rõ họ tên)</i>
              <br><br><br>
              <b>${DOM.hoTen.value}</b>
            </div>
          </div>
      
      `;

      DOM.previewModal.classList.remove('hidden');
      DOM.previewModal.style.display = 'flex';
    }

    function closePreviewModal() {
      DOM.previewModal.classList.add('hidden');
      DOM.previewModal.style.display = 'none';
    }

    // Gắn sự kiện an toàn
   if (DOM.btnBackHeader) {
  DOM.btnBackHeader.addEventListener('click', () => {
    closeHoiThaoModal();
    if (typeof window.showMainView === 'function') {
      window.showMainView();
    }
  });
}
    if (DOM.btnReset) DOM.btnReset.addEventListener('click', () => { DOM.form.reset(); initUser(); });
    if (DOM.btnPreview) DOM.btnPreview.addEventListener('click', openPreviewModal);
    if (DOM.btnClosePreview) DOM.btnClosePreview.addEventListener('click', closePreviewModal);
    if (DOM.btnBackForm) DOM.btnBackForm.addEventListener('click', closePreviewModal);

    if (DOM.btnConfirmSubmit) {
      DOM.btnConfirmSubmit.addEventListener('click', () => {
        showAlert("Đã xác nhận gửi báo cáo thành công!");
        closePreviewModal();
        closeHoiThaoModal();
      });
    }

    if (DOM.form) {
      DOM.form.addEventListener('submit', (e) => {
        e.preventDefault();
        openPreviewModal();
      });
    }

    initUser();
  })();
</script>
