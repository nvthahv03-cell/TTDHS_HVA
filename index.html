<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F4C81">
    <title>Đăng nhập – TTDHS_HVA | Trung tâm Điều hành số THPT Hòa Vang</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ms: {
                            primary: '#0F4C81',   /* Microsoft Deep Blue */
                            secondary: '#29B6F6', /* Sky Accent */
                            success: '#10B981',
                            danger: '#EF4444',
                            bg: '#F5F7FA',        /* Windows 11 Light BG */
                            card: '#FFFFFF',
                            border: '#E2E8F0'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        .safe-pt { padding-top: env(safe-area-inset-top); }
        .ms-blur-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="h-full bg-ms-bg text-slate-800 overflow-x-hidden antialiased selection:bg-ms-secondary/20 selection:text-ms-primary">

    <!-- Background Decorative Gradient Blobs -->
    <div class="fixed inset-0 -z-50 overflow-hidden bg-[#F5F7FA]">
        <div class="absolute -top-[15%] -left-[10%] w-[60%] h-[50%] rounded-full bg-[#29B6F6]/15 blur-[120px]"></div>
        <div class="absolute top-[40%] -right-[15%] w-[65%] h-[55%] rounded-full bg-[#0F4C81]/10 blur-[140px]"></div>
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center px-4 py-8 safe-pt safe-pb">

        <!-- Header Block: Brand Logo & Title -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#0F4C81] text-white shadow-lg shadow-[#0F4C81]/20 mb-3 border border-white/40">
                <span class="font-extrabold text-xl tracking-wider">HVA</span>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Trung tâm Điều hành số</h1>
            <p class="text-xs font-semibold text-ms-primary mt-0.5 uppercase tracking-wide">Trường THPT Hòa Vang</p>
            <p class="text-xs text-slate-500 mt-1.5">Hệ thống điều hành số Trường THPT Hòa Vang</p>
        </div>

        <!-- Login Card Block -->
        <div class="w-full max-w-sm">
            <div class="ms-blur-card border border-slate-200/80 rounded-2xl shadow-xl shadow-slate-200/60 p-6 sm:p-7 transition-all">

                <div class="mb-5 pb-4 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="bi bi-shield-lock-fill text-ms-primary"></i> Đăng nhập hệ thống
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">Sử dụng tài khoản cán bộ, giáo viên đã cấp</p>
                </div>

                <form id="loginForm" class="space-y-4">
                    <!-- Username Input -->
                    <div>
                        <label for="username" class="block text-[11px] font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                            Tên đăng nhập
                        </label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                                <i class="bi bi-person text-base"></i>
                            </span>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                required
                                autocomplete="username"
                                placeholder="Nhập tên đăng nhập"
                                class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-white/90 text-slate-800 text-xs font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-ms-primary/20 focus:border-ms-primary transition-all shadow-sm"
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="password" class="block text-[11px] font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                            Mật khẩu
                        </label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                                <i class="bi bi-key text-base"></i>
                            </span>
                            <!-- Prefix HVA@ -->
                            <span class="absolute left-9 top-1/2 -translate-y-1/2 text-slate-700 font-bold text-xs select-none pointer-events-none">
                                HVA@
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                required
                                maxlength="4"
                                pattern="[0-9]*"
                                inputmode="numeric"
                                autocomplete="current-password"
                                placeholder="4 số bí mật"
                                class="w-full pl-20 pr-10 py-2.5 rounded-xl border border-slate-200 bg-white/90 text-slate-800 text-xs font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-ms-primary/20 focus:border-ms-primary transition-all shadow-sm"
                            >
                            <button 
                                type="button"
                                id="togglePassword"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 rounded-md transition focus:outline-none"
                                aria-label="Hiện/Ẩn mật khẩu"
                            >
                                <i class="bi bi-eye text-base" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full mt-2 py-3 rounded-xl bg-ms-primary hover:bg-[#0b3c66] text-white font-semibold text-xs shadow-md shadow-ms-primary/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
                    >
                        <span id="btnText">Đăng nhập</span>
                        <i class="bi bi-arrow-right-circle text-sm" id="btnIcon"></i>
                    </button>

                    <!-- Error Alert -->
                    <div id="errorMsg" class="hidden rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-xs p-3 text-center font-medium leading-relaxed"></div>
                </form>
            </div>

            <!-- Footer Copy -->
            <div class="text-center text-[11px] text-slate-400 mt-6 space-y-0.5">
                <p>© 2026 Trung tâm Điều hành số THPT Hòa Vang</p>
                <p class="font-medium text-ms-primary/80">Phiên bản 2.0 TTĐHS_HVA © 2026</p>
            </div>
        </div>
    </div>

    <!-- LOGIC SỬ XỬ LÝ -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzrpNdCyBsIIKJqx3DL2OZA0nWAkmFMPvyq8JYBrOhDvPELheNX4CNeIFvB7xNRG3VR/exec";

        const loginForm     = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const submitBtn     = document.getElementById("submitBtn");
        const btnText       = document.getElementById("btnText");
        const btnIcon       = document.getElementById("btnIcon");
        const errorMsg      = document.getElementById("errorMsg");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon       = document.getElementById("eyeIcon");

        // Toggle show/hide password
        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            eyeIcon.className = isPassword ? "bi bi-eye-slash text-base" : "bi bi-eye text-base";
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const rawPassword = passwordInput.value.trim();
            const password = "HVA@" + rawPassword;

            if (!username || !rawPassword) {
                showError("Vui lòng nhập đầy đủ tên đăng nhập và 4 số tự nhiên của mật khẩu.");
                return;
            }

            setLoading(true);
            hideError();

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "login",
                        username,
                        password
                    })
                });

                if (!response.ok) {
                    throw new Error("Lỗi kết nối máy chủ. Mã lỗi: " + response.status);
                }

                const result = await response.json();

                if (result.success) {

    // Lưu người dùng đăng nhập
    localStorage.setItem(
        "user",
        JSON.stringify(result.user)
    );

    // Dọn cache giao diện/PWA cũ trước khi vào hệ thống
    try {
        if ("caches" in window) {
            const cacheNames = await caches.keys();

            await Promise.all(
                cacheNames.map(cacheName =>
                    caches.delete(cacheName)
                )
            );

            console.log(
                "[HVA] Đã dọn cache phiên bản cũ."
            );
        }
    } catch (cacheError) {
        console.warn(
            "[HVA] Không thể dọn cache:",
            cacheError
        );
    }

    // Vào Dashboard và tránh lấy main.html cũ từ cache
    window.location.replace(
        "main.html?v=" + Date.now()
    );

} else {
                    showError(result.message || "Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin.");
                }
            } catch (error) {
                console.error(error);
                showError("Đã xảy ra lỗi mạng hoặc không thể kết nối đến máy chủ. Vui lòng thử lại sau.");
            } finally {
                setLoading(false);
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.remove("hidden");
        }

        function hideError() {
            errorMsg.textContent = "";
            errorMsg.classList.add("hidden");
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            usernameInput.disabled = isLoading;
            passwordInput.disabled = isLoading;

            if (isLoading) {
                btnText.textContent = "Đang xác thực...";
                btnIcon.className = "bi bi-arrow-repeat text-sm animate-spin";
            } else {
                btnText.textContent = "Đăng nhập";
                btnIcon.className = "bi bi-arrow-right-circle text-sm";
            }
        }

        // Tự động focus ô tài khoản
        usernameInput.focus();
    </script>
</body>
</html>
