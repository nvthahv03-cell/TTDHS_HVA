<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung tâm Điều hành số - Báo cáo Hội thảo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col bg-slate-50 selection:bg-emerald-100 selection:text-[#059669]">

    <!-- ================= HEADER TTĐHS_HVA ================= -->
    <header class="relative sticky top-0 z-40 overflow-hidden shadow-lg">

        <!-- Background Gradient Tone Emerald/Teal chuyên biệt cho Hội thảo -->
        <div class="absolute inset-0 bg-gradient-to-r from-[#064E3B] via-[#047857] to-[#10B981]"></div>

        <!-- Glow -->
        <div class="absolute -left-20 -top-20 w-72 h-72 rounded-full bg-emerald-300/20 blur-3xl"></div>
        <div class="absolute -right-24 -bottom-24 w-80 h-80 rounded-full bg-teal-300/15 blur-3xl"></div>

        <!-- Grid pattern -->
        <div class="absolute inset-0 opacity-[0.06]"
            style="
            background-image:
            linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
            background-size:28px 28px;">
        </div>

        <!-- Circuit Pattern -->
        <svg class="absolute inset-0 w-full h-full opacity-[0.12]" preserveAspectRatio="none">
            <g stroke="white" stroke-width="1.2" fill="none">
                <path d="M35 28 H120 V68 H200"/>
                <path d="M300 20 V55 H390 V95"/>
                <path d="M560 28 H650 V60 H760"/>
            </g>
            <g fill="white">
                <circle cx="35" cy="28" r="2.6"/>
                <circle cx="120" cy="68" r="2.6"/>
                <circle cx="200" cy="68" r="2.6"/>
                <circle cx="300" cy="20" r="2.6"/>
                <circle cx="390" cy="55" r="2.6"/>
                <circle cx="390" cy="95" r="2.6"/>
                <circle cx="560" cy="28" r="2.6"/>
                <circle cx="650" cy="60" r="2.6"/>
                <circle cx="760" cy="60" r="2.6"/>
            </g>
        </svg>

        <div class="relative max-w-3xl mx-auto px-4 pt-4 pb-5">

            <!-- Dòng 1 -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button type="button"
                        onclick="window.location.href='main.html'"
                        class="w-11 h-11 rounded-2xl
                               bg-white/12
                               border border-white/20
                               backdrop-blur
                               hover:bg-white/20
                               transition flex items-center justify-center">
                        <i class="bi bi-arrow-left text-white text-xl"></i>
                    </button>
                    <div class="text-white font-bold uppercase tracking-wide text-sm">
                        HVA - THPT HÒA VANG
                    </div>
                </div>

                <div class="flex items-center gap-2
                            px-3 py-2
                            rounded-full
                            bg-white/12
                            border border-white/15
                            backdrop-blur">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-white text-xs font-semibold">
                        Hệ thống kết nối
                    </span>
                </div>
            </div>

            <!-- Dòng 2 -->
            <div class="mt-2 ml-14">
                <div class="text-white
                            text-[24px]
                            leading-none
                            font-black
                            uppercase">
                    BÁO CÁO HỘI THẢO
                </div>
            </div>

        </div>
    </header>

    <!-- NỘI DUNG FORM -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 pb-28 overflow-y-auto">
        <form id="hoiThaoForm" class="space-y-5">
            
            <!-- ================= THÔNG TIN NGƯỜI BÁO CÁO ================= -->
            <div class="bg-gradient-to-br
                        from-[#F0FDF4]
                        to-[#DCFCE7]
                        border border-emerald-100
                        rounded-3xl
                        shadow-sm
                        p-5
                        mb-5">
                <div class="flex items-center gap-4">
                    <!-- Icon -->
                    <div class="w-14 h-14
                                rounded-2xl
                                bg-gradient-to-br
                                from-[#047857]
                                to-[#10B981]
                                flex items-center justify-center
                                shadow-md shrink-0">
                        <i class="bi bi-person-badge-fill text-white text-2xl"></i>
                    </div>

                    <!-- Thông tin -->
                    <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-emerald-800 uppercase tracking-wider">Họ và tên</label>
                            <input type="text" id="hoTen" name="hoTen" readonly required placeholder="Đang tải..."
                                class="w-full bg-transparent font-bold text-[#047857] text-lg leading-tight outline-none border-b border-dashed border-emerald-300 focus:border-emerald-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-emerald-800 uppercase tracking-wider">Tổ chuyên môn</label>
                            <input type="text" id="toChuyenMon" name="toChuyenMon" readonly placeholder="Đang tải..."
                                class="w-full bg-transparent font-semibold text-slate-700 text-sm outline-none border-b border-dashed border-emerald-300 focus:border-emerald-600">
                        </div>
                    </div>
                </div>
            </div>

            <!-- TÊN HỘI THẢO / CHỦ ĐỀ -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-1.5">
                <label class="flex items-center gap-2 text-xs font-semibold text-[#047857]">
                    <i class="bi bi-[#047857] bi-easel-fill text-emerald-600"></i>
                    <span>Tên/Chủ đề Hội thảo <span class="text-red-500">*</span></span>
                </label>
                <input type="text" id="tenHoiThao" required class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-[#047857] focus:bg-white transition" placeholder="Nhập tên hoặc chủ đề hội thảo...">
            </div>

            <!-- THỜI GIAN & ĐỊA ĐIỂM -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-1.5">
                    <label class="flex items-center gap-2 text-xs font-semibold text-[#047857]">
                        <i class="bi bi-calendar-event-fill text-emerald-600"></i>
                        <span>Ngày tổ chức <span class="text-red-500">*</span></span>
                    </label>
                    <input type="date" id="ngayToChuc" required class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-[#047857] focus:bg-white transition">
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-1.5">
                    <label class="flex items-center gap-2 text-xs font-semibold text-[#047857]">
                        <i class="bi bi-geo-alt-fill text-emerald-600"></i>
                        <span>Địa điểm tổ chức</span>
                    </label>
                    <input type="text" id="diaDiem" class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-[#047857] focus:bg-white transition" placeholder="Ví dụ: Hội trường A, Trực tuyến...">
                </div>
            </div>

            <!-- NỘI DUNG TÓM TẮT -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-1.5">
                <label class="flex items-center gap-2 text-xs font-semibold text-[#047857]">
                    <i class="bi bi-journal-text text-emerald-600"></i>
                    <span>Nội dung tóm tắt / Kết quả hội thảo <span class="text-red-500">*</span></span>
                </label>
                <textarea id="noiDungTromTat" rows="4" required class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-[#047857] focus:bg-white transition" placeholder="Tóm tắt các nội dung chính, kết luận hoặc kiến nghị rút ra từ hội thảo..."></textarea>
            </div>

            <!-- LINK MINH CHỨNG / TÀI LIỆU -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-1.5">
                <label class="flex items-center gap-2 text-xs font-semibold text-[#047857]">
                    <i class="bi bi-link-45deg text-emerald-600 text-base"></i>
                    <span>Link tài liệu / Hình ảnh minh chứng (Google Drive, Kế hoạch, v.v.)</span>
                </label>
                <input type="url" id="linkMinhChung" class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-[#047857] focus:bg-white transition" placeholder="https://drive.google.com/...">
            </div>

            <!-- NÚT FIX BOTTOM -->
            <div class="fixed bottom-0 left-0 right-0
                        bg-white/80
                        backdrop-blur-md
                        border-t border-slate-200/60
                        p-3 sm:p-4
                        z-40
                        shadow-[0_-6px_24px_rgba(4,120,87,0.08)]">
                <div class="max-w-3xl mx-auto grid grid-cols-2 gap-3">
                    <!-- Hủy -->
                    <button
                        type="button"
                        onclick="window.location.href='main.html'"
                        class="h-14
                               rounded-2xl
                               bg-red-600
                               hover:bg-red-700
                               text-white
                               font-bold
                               flex items-center justify-center gap-2
                               transition-all active:scale-95">
                        <i class="bi bi-x-circle-fill"></i>
                        <span>Hủy bỏ</span>
                    </button>

                    <!-- Gửi Báo cáo -->
                    <button
                        type="submit"
                        id="btnSubmit"
                        class="h-14
                               rounded-2xl
                               bg-[#047857]
                               hover:bg-[#065F46]
                               text-white
                               font-bold
                               flex items-center justify-center gap-2
                               transition-all active:scale-95">
                        <i class="bi bi-send-fill"></i>
                        <span>Gửi báo cáo</span>
                    </button>
                </div>
            </div>

        </form>
    </main>

    <!-- SCRIPT XỬ LÝ -->
    <script>
        // Endpoint Google Apps Script chung của dự án
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjq11TcDE4tyOsPl6NOw1q6r8f14r3Z3qQPuSAgic7Xf6XK4gXjwHOBem4I_IGnALZ/exec";

        // Tự động tải thông tin người dùng đăng nhập khi mở trang
        window.addEventListener('DOMContentLoaded', async function() {
            // Tự động gán ngày hôm nay cho trường Ngày tổ chức
            document.getElementById('ngayToChuc').valueAsDate = new Date();
            
            await loadThongTinNguoiDung();
        });

        // Lấy thông tin cá nhân từ Session/Google Sheet
        async function loadThongTinNguoiDung() {
            try {
                // Ưu tiên lấy từ SessionStorage nếu đã đăng nhập trước đó
                const cachedUser = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
                if (cachedUser.hoTen) {
                    document.getElementById('hoTen').value = cachedUser.hoTen;
                    document.getElementById('toChuyenMon').value = cachedUser.toBoPhan || cachedUser.toChuyenMon || '';
                    return;
                }

                // Nếu chưa có cache, gọi API lấy người dùng hiện tại
                const res = await fetch(`${SCRIPT_URL}?action=getCurrentUser`);
                const data = await res.json();
                if (data && data.hoTen) {
                    document.getElementById('hoTen').value = data.hoTen;
                    document.getElementById('toChuyenMon').value = data.toBoPhan || data.toChuyenMon || '';
                    sessionStorage.setItem('userInfo', JSON.stringify(data));
                } else {
                    // Mặc địnhfallback nếu chưa thiết lập auth
                    document.getElementById('hoTen').value = "Nguyễn Văn A";
                    document.getElementById('toChuyenMon').value = "Toán - Tin";
                }
            } catch (e) {
                console.warn("Không thể tải thông tin tự động, gán mặc định:", e);
                document.getElementById('hoTen').value = "Giáo viên";
                document.getElementById('toChuyenMon').value = "Toán - Tin";
            }
        }

        // Xử lý gửi báo cáo
        document.getElementById('hoiThaoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Đang lưu...";

            const payload = {
                action: 'createHoiThaoReport',
                hoTen: document.getElementById('hoTen').value,
                toChuyenMon: document.getElementById('toChuyenMon').value,
                tenHoiThao: document.getElementById('tenHoiThao').value,
                ngayToChuc: document.getElementById('ngayToChuc').value,
                diaDiem: document.getElementById('diaDiem').value,
                noiDung: document.getElementById('noiDungTromTat').value,
                linkMinhChung: document.getElementById('linkMinhChung').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert('Gửi báo cáo Hội thảo thành công!');
                window.location.href = 'main.html';
            } catch (err) {
                alert('Có lỗi xảy ra khi gửi báo cáo. Vui lòng thử lại!');
            } finally {
                btn.disabled = false;
                btn.innerText = "Gửi báo cáo";
            }
        });
    </script>
</body>
</html>
