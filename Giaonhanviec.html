    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjq11TcDE4tyOsPl6NOw1q6r8f14r3Z3qQPuSAgic7Xf6XK4gXjwHOBem4I_IGnALZ/exec";

        let dsToData = [];
        let dsNhanSuLoadedByTo = {};
        let selectedObjects = [];
        let vanBanChon = { soVanBan: '', tenVanBan: '' };
        window.tmpVanBanList = [];

        window.addEventListener('DOMContentLoaded', async function() {
            await loadDanhSachTo();
        });

        // 1. Lấy danh sách Tổ
        async function loadDanhSachTo() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getDanhSachTo`);
                dsToData = await res.json();
                renderToAccordion();
            } catch (e) {
                console.error("Lỗi lấy danh sách tổ:", e);
            }
        }

        function renderToAccordion() {
            const container = document.getElementById('danhSachToAccordion');
            container.innerHTML = '';

            if (!dsToData || dsToData.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 italic p-2">Không tìm thấy danh sách tổ.</div>';
                return;
            }

            dsToData.forEach(item => {
                const tenTo = item.tenTo;
                const div = document.createElement('div');
                div.className = "border border-slate-200/80 rounded-xl overflow-hidden bg-white shadow-sm";
                div.innerHTML = `
                    <div class="p-3 bg-slate-50/50 flex items-center justify-between text-xs font-bold text-[#0F4C81]">
                        <button type="button" onclick="toggleToAccordion('${tenTo}')" class="flex-1 flex items-center gap-2 text-left">
                            <i id="iconTo-${tenTo}" class="bi bi-chevron-right text-slate-400 transition-transform"></i>
                            <i class="bi bi-folder2-open text-blue-500"></i>
                            <span>${tenTo}</span>
                            <span class="text-[10px] font-normal text-slate-400">(${item.soLuong} người)</span>
                        </button>
                        <button type="button" onclick="chonTronTo('${tenTo}')" class="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-[11px] font-semibold transition">
                            <i class="bi bi-check-all"></i> Chọn trọn tổ
                        </button>
                    </div>
                    <div id="bodyTo-${tenTo}" class="hidden p-3 bg-blue-50/10 border-t border-slate-100">
                        <div class="p-2 text-xs text-slate-400 italic" id="loadingTo-${tenTo}">Đang tải nhân sự...</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 hidden" id="gridTo-${tenTo}"></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 2. Mở/Đóng Accordion & Lazy Load Nhân sự
        async function toggleToAccordion(tenTo) {
            const body = document.getElementById(`bodyTo-${tenTo}`);
            const icon = document.getElementById(`iconTo-${tenTo}`);
            
            if (body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                if (icon) icon.classList.add('rotate-90');

                if (!dsNhanSuLoadedByTo[tenTo]) {
                    await loadNhanSuCuaTo(tenTo);
                }
            } else {
                body.classList.add('hidden');
                if (icon) icon.classList.remove('rotate-90');
            }
        }

        async function loadNhanSuCuaTo(tenTo) {
            const loading = document.getElementById(`loadingTo-${tenTo}`);
            const grid = document.getElementById(`gridTo-${tenTo}`);

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getNhanSuTheoTo&to=${encodeURIComponent(tenTo)}`);
                const listNS = await res.json();
                dsNhanSuLoadedByTo[tenTo] = listNS;

                loading.classList.add('hidden');
                grid.classList.remove('hidden');

                grid.innerHTML = listNS.map(ns => {
                    const isChecked = selectedObjects.some(x => x.username === ns.username && x.loai === 'CANHAN');
                    return `
                        <label class="flex items-center space-x-2.5 p-2 rounded-xl bg-white hover:bg-blue-50/50 cursor-pointer border border-slate-200/60 transition shadow-sm">
                            <input type="checkbox" data-username="${ns.username}" data-hoten="${ns.hoTen}" data-to="${tenTo}" ${isChecked ? 'checked' : ''} onchange="toggleChonCaNhan(this, '${ns.username}', '${ns.hoTen}', '${tenTo}')" class="w-4 h-4 text-[#0F4C81] rounded border-slate-300">
                            <span class="text-xs font-semibold text-slate-700">${ns.hoTen}</span>
                            <span class="text-[10px] text-slate-400">(${ns.vaiTro || 'Thành viên'})</span>
                        </label>
                    `;
                }).join('');
            } catch (e) {
                loading.innerText = 'Lỗi tải danh sách nhân sự.';
            }
        }

        function chonTronTo(tenTo) {
            if (!selectedObjects.some(x => x.toBoPhan === tenTo && x.loai === 'TO')) {
                selectedObjects.push({ username: '', hoTen: `Tổ ${tenTo}`, toBoPhan: tenTo, loai: 'TO' });
            }
            updateTagDisplay();
        }

        function toggleChonCaNhan(cb, username, hoTen, toBoPhan) {
            if (cb.checked) {
                if (!selectedObjects.some(x => x.username === username && x.loai === 'CANHAN')) {
                    selectedObjects.push({ username, hoTen, toBoPhan, loai: 'CANHAN' });
                }
            } else {
                selectedObjects = selectedObjects.filter(x => !(x.username === username && x.loai === 'CANHAN'));
            }
            updateTagDisplay();
        }

        function updateTagDisplay() {
            const container = document.getElementById('danhSachDaChon');
            const badgeNguoi = document.getElementById('badgeThongKeNguoi');
            const badgeTo = document.getElementById('badgeThongKeTo');

            const countTo = selectedObjects.filter(x => x.loai === 'TO').length;
            const countNguoi = selectedObjects.filter(x => x.loai === 'CANHAN').length;

            badgeTo.innerText = `${countTo} tổ`;
            badgeNguoi.innerText = `${countNguoi} cá nhân`;

            if (selectedObjects.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400 italic">Chưa chọn đối tượng nào...</span>';
                return;
            }

            container.innerHTML = selectedObjects.map((item, idx) => `
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm ${item.loai === 'TO' ? 'bg-indigo-50 text-indigo-800 border border-indigo-200' : 'bg-white text-[#0F4C81] border border-blue-200'}">
                    <i class="bi ${item.loai === 'TO' ? 'bi-diagram-3-fill' : 'bi-person-fill'}"></i>
                    ${item.hoTen}
                    <i class="bi bi-x-circle-fill text-slate-400 hover:text-red-500 cursor-pointer" onclick="removeSelected(${idx})"></i>
                </span>
            `).join('');
        }

        function removeSelected(idx) {
            selectedObjects.splice(idx, 1);
            updateTagDisplay();
        }

        // 3. Nguồn giao & Tra cứu Văn bản
        function xuLyThayDoiNguonGiao(val) {
            const card = document.getElementById('cardVanBan');
            if (val === 'Theo văn bản') {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
                vanBanChon = { soVanBan: '', tenVanBan: '' };
            }
        }

        async function timKiemVanBan() {
            const q = document.getElementById('inputTimVanBan').value.trim();
            const vung = document.getElementById('vungKetQuaVanBan');
            vung.classList.remove('hidden');
            vung.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Đang tra cứu Kho Văn bản...</div>';

            try {
                const res = await fetch(`${SCRIPT_URL}?action=searchVanBan&q=${encodeURIComponent(q)}`);
                const list = await res.json();

                if (!list || list.length === 0) {
                    vung.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Không thấy văn bản.</div>';
                    return;
                }

                window.tmpVanBanList = list;
                vung.innerHTML = list.map((item, index) => `
                    <div onclick='selectVanBan(${index})' class="p-2.5 hover:bg-blue-50 cursor-pointer text-xs">
                        <div class="font-bold text-[#0F4C81]">${item.soVanBan || 'Không số'}</div>
                        <div class="text-slate-800 truncate">${item.tenVanBan || ''}</div>
                    </div>
                `).join('');
            } catch (e) {
                vung.innerHTML = '<div class="p-3 text-xs text-red-500 text-center">Lỗi tìm văn bản.</div>';
            }
        }

        function selectVanBan(index) {
            const item = window.tmpVanBanList[index];
            if (!item) return;

            vanBanChon = item;
            document.getElementById('lblSoVB').innerText = item.soVanBan || 'Không số';
            document.getElementById('lblNgayBH').innerText = item.ngayBanHanh || '--/--/----';
            document.getElementById('lblTenVB').innerText = item.tenVanBan || '';
            document.getElementById('vungKetQuaVanBan').classList.add('hidden');
        }
        // ===== BỔ SUNG TÍNH NĂNG 02 NÚT THAO TÁC ĐỐI TƯỢNG ===== //

        // 1. Hàm XÁC NHẬN ĐỐI TƯỢNG
        function xacNhanDoiTuong() {
            if (!selectedObjects || selectedObjects.length === 0) {
                alert('Vui lòng chọn ít nhất một tổ hoặc cá nhân nhận nhiệm vụ!');
                return;
            }

            // Khóa vùng chọn đối tượng & vùng đã chọn
            const accordion = document.getElementById('danhSachToAccordion');
            const daChon = document.getElementById('danhSachDaChon');
            if (accordion) accordion.classList.add('area-locked');
            if (daChon) daChon.classList.add('area-locked');

            // Thu gọn tất cả Accordion
            if (Array.isArray(dsToData)) {
                dsToData.forEach(item => {
                    const body = document.getElementById(`bodyTo-${item.tenTo}`);
                    const icon = document.getElementById(`iconTo-${item.tenTo}`);
                    if (body) body.classList.add('hidden');
                    if (icon) icon.classList.remove('rotate-90');
                });
            }

            // Cuộn mượt xuống phần nhập Tiêu đề / Nội dung công việc
            const target = document.getElementById('tieuDe');
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.focus();
            }
        }

        // 2. Hàm CHỌN LẠI ĐỐI TƯỢNG
        function chonLaiDoiTuong() {
            // Xóa toàn bộ mảng dữ liệu đã chọn
            selectedObjects = [];

            // Cập nhật lại giao diện các chip tag "Đã chọn" và badge thống kê
            updateTagDisplay();

            // Bỏ chọn tất cả các checkbox đã tích
            const checkboxes = document.querySelectorAll('#danhSachToAccordion input[type="checkbox"]');
            checkboxes.forEach(cb => { cb.checked = false; });

            // Mở khóa vùng chọn đối tượng
            const accordion = document.getElementById('danhSachToAccordion');
            const daChon = document.getElementById('danhSachDaChon');
            if (accordion) accordion.classList.remove('area-locked');
            if (daChon) daChon.classList.remove('area-locked');
        }
// Hàm hiển thị Modal Preview Biên bản
function previewTask() {
    const now = new Date();
    
    // 1. Cập nhật thông tin thời gian
    document.getElementById('prevThoiGianLap').innerText = now.toLocaleString('vi-VN');
    document.getElementById('prevNgayGiao').innerText = now.toLocaleDateString('vi-VN');
    document.getElementById('prevNgayLap').innerText = String(now.getDate()).padStart(2, '0');
    document.getElementById('prevThangLap').innerText = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('prevNamLap').innerText = now.getFullYear();

    // 2. Lấy tự động thông tin người giao theo tài khoản/giao diện
    const nguoiGiaoText = document.getElementById('nguoiGiao').innerText.trim();
    const chucVuText = document.getElementById('chucVuNguoiGiao').innerText.trim();
    
    document.getElementById('prevNguoiGiao').innerText = nguoiGiaoText;
    document.getElementById('prevChucVuNguoiGiao').innerText = chucVuText;
    document.getElementById('prevChucVuKy').innerText = chucVuText;
    document.getElementById('prevHoTenKy').innerText = nguoiGiaoText.replace(/^(Thầy|Cô)\s+/i, '');

    // 3. Đối tượng nhận
    if (typeof selectedObjects !== 'undefined' && selectedObjects.length > 0) {
        document.getElementById('prevNguoiNhan').innerText = selectedObjects.map(x => x.hoTen).join(', ');
    } else {
        document.getElementById('prevNguoiNhan').innerText = "(Chưa chọn đối tượng nhận)";
    }

    // 4. Nguồn giao & Văn bản
    const nguonGiaoRadio = document.querySelector('input[name="nguonGiaoRadio"]:checked');
    document.getElementById('prevNguonGiao').innerText = nguonGiaoRadio ? nguonGiaoRadio.value : 'Theo văn bản';

    if (typeof vanBanChon !== 'undefined' && vanBanChon.soVanBan) {
        document.getElementById('prevVanBan').innerText = `${vanBanChon.soVanBan} - ${vanBanChon.tenVanBan || ''}`;
    } else {
        document.getElementById('prevVanBan').innerText = "Không có";
    }

    // 5. Mức độ, Tiêu đề, Nội dung
    document.getElementById('prevMucDo').innerText = document.getElementById('mucDo').value;
    
    const tieuDe = document.getElementById('tieuDe').value.trim();
    const noiDung = document.getElementById('noiDung').value.trim();
    document.getElementById('prevTieuDeNoiDung').innerHTML = `<strong>${tieuDe || '(Chưa nhập tiêu đề)'}</strong><br>${noiDung || ''}`;

    // 6. Minh chứng & Hạn hoàn thành
    const yeuCauMC = document.getElementById('yeuCauMinhChung').value;
    document.getElementById('prevMinhChung').innerText = yeuCauMC === 'Có' ? 'Có yêu cầu minh chứng / báo cáo kết quả' : 'Không yêu cầu';

    const hanHT = document.getElementById('hanHoanThanh').value;
    if (hanHT) {
        const [yyyy, mm, dd] = hanHT.split('-');
        document.getElementById('prevHanHoanThanh').innerText = `${dd}/${mm}/${yyyy}`;
        document.getElementById('prevThoiHanBaoCao').innerText = `${dd}/${mm}/${yyyy}`;
    } else {
        document.getElementById('prevHanHoanThanh').innerText = 'Chưa thiết lập';
        document.getElementById('prevThoiHanBaoCao').innerText = 'Theo hạn hoàn thành nhiệm vụ';
    }

    // 7. Chế độ báo cáo (Checkbox)
    if (yeuCauMC === 'Không') {
        document.getElementById('chkBc1').innerText = '☑';
        document.getElementById('chkBc2').innerText = '☐';
    } else {
        document.getElementById('chkBc1').innerText = '☐';
        document.getElementById('chkBc2').innerText = '☑';
    }

    // Hiển thị modal
    document.getElementById('modalPreview').classList.remove('hidden');
}

// Hàm đóng Modal Preview
function closePreviewModal() {
    document.getElementById('modalPreview').classList.add('hidden');
}

        // 4. Submit Form
        document.getElementById('formGiaoViecFull').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (selectedObjects.length === 0) {
                alert('Vui lòng chọn ít nhất một cá nhân hoặc tổ nhận nhiệm vụ!');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i><span>Đang lưu...</span>';

            const payload = {
                action: 'createTask',
                nguoiGiao: document.getElementById('nguoiGiao').innerText.trim(),
                chucVuNguoiGiao: document.getElementById('chucVuNguoiGiao').innerText.trim(),
                loaiNhiemVu: document.getElementById('loaiNhiemVu').value,
                nguonGiao: document.querySelector('input[name="nguonGiaoRadio"]:checked').value,
                soVanBan: vanBanChon.soVanBan || '',
                tenVanBan: vanBanChon.tenVanBan || '',
                mucDo: document.getElementById('mucDo').value,
                tieuDe: document.getElementById('tieuDe').value,
                noiDung: document.getElementById('noiDung').value,
                yeuCauMinhChung: document.getElementById('yeuCauMinhChung').value,
                hanHoanThanh: document.getElementById('hanHoanThanh').value,
                danhSachNguoiNhan: selectedObjects
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert('Giao nhiệm vụ thành công! Dữ liệu đã được ghi nhận.');
                window.location.href = 'main.html';
            } catch (err) {
                alert('Lỗi khi gửi dữ liệu!');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send-fill"></i><span>Giao việc</span>';
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            const user = JSON.parse(localStorage.getItem("user") || "{}");

            document.getElementById("nguoiGiao").textContent =
                user.fullName || "";

            document.getElementById("chucVuNguoiGiao").textContent =
                user.workPosition || "";
        });
    </script>
