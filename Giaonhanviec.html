<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung tâm Điều hành số - Giao nhiệm vụ v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-full text-slate-100 antialiased flex flex-col bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 selection:bg-blue-600 selection:text-white">

    <!-- HEADER TRANG -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-blue-900/50 px-4 py-3 sticky top-0 z-30 shadow-lg">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button type="button" onclick="window.location.href='main.html'" class="w-9 h-9 rounded-xl bg-blue-950/80 hover:bg-blue-900 border border-blue-800/50 active:scale-95 flex items-center justify-center text-blue-400 transition shadow-sm">
                    <i class="bi bi-arrow-left text-lg font-bold"></i>
                </button>
                <div>
                    <h1 class="text-[11px] font-medium text-blue-300/80 leading-none">THPT Hòa Vang - Trung tâm Điều hành số</h1>
                    <p class="text-base font-bold text-white mt-0.5 leading-tight">Giao nhiệm vụ v2</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-950/80 border border-blue-700/50 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[11px] font-semibold text-blue-200">Hệ thống kết nối</span>
            </div>
        </div>
    </header>

    <!-- NỘI DUNG FORM -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 pb-28 overflow-y-auto">
        <form id="formGiaoViecFull" class="space-y-5">
            
            <!-- Thông tin Người giao (Tự truy xuất) -->
            <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md grid grid-cols-1 sm:grid-cols-2 gap-4 relative overflow-hidden">
                <div class="absolute top-0 right-0 px-3 py-1 bg-blue-600/20 rounded-bl-xl border-l border-b border-blue-500/30 flex items-center gap-1 text-[10px] text-blue-300 font-medium">
                    <i class="bi bi-shield-check text-emerald-400"></i>
                    <span>Xác thực tài khoản</span>
                </div>

                <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-900/60 border border-blue-900/40">
                    <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-lg shadow-sm">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="block text-[11px] font-medium text-slate-400">Người giao</label>
                        <input type="text" id="nguoiGiao" readonly class="w-full bg-transparent text-sm font-bold text-blue-200 outline-none truncate" value="Đang xác thực...">
                    </div>
                </div>

                <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-900/60 border border-blue-900/40">
                    <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-lg shadow-sm">
                        <i class="bi bi-briefcase-fill"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="block text-[11px] font-medium text-slate-400">Chức vụ</label>
                        <input type="text" id="chucVuNguoiGiao" readonly class="w-full bg-transparent text-sm font-bold text-blue-200 outline-none truncate" value="Đang lấy dữ liệu...">
                    </div>
                </div>
            </div>

            <!-- NGUỒN GIAO -->
            <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-3">
                <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                    <i class="bi bi-folder-symlink-fill text-blue-400"></i>
                    <span>Nguồn giao</span>
                </label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <label class="flex items-center gap-2 p-2.5 rounded-xl border border-blue-900/50 bg-slate-900/40 hover:bg-blue-950/60 cursor-pointer transition">
                        <input type="radio" name="nguonGiaoRadio" value="Theo văn bản" checked onchange="xuLyThayDoiNguonGiao(this.value)" class="w-4 h-4 text-blue-500 focus:ring-blue-600">
                        <span class="text-xs font-semibold text-slate-200">Theo văn bản</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 rounded-xl border border-blue-900/50 bg-slate-900/40 hover:bg-blue-950/60 cursor-pointer transition">
                        <input type="radio" name="nguonGiaoRadio" value="Chỉ đạo trực tiếp" onchange="xuLyThayDoiNguonGiao(this.value)" class="w-4 h-4 text-blue-500 focus:ring-blue-600">
                        <span class="text-xs font-semibold text-slate-200">Chỉ đạo trực tiếp</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 rounded-xl border border-blue-900/50 bg-slate-900/40 hover:bg-blue-950/60 cursor-pointer transition">
                        <input type="radio" name="nguonGiaoRadio" value="Công việc thường xuyên" onchange="xuLyThayDoiNguonGiao(this.value)" class="w-4 h-4 text-blue-500 focus:ring-blue-600">
                        <span class="text-xs font-semibold text-slate-200">Thường xuyên</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 rounded-xl border border-blue-900/50 bg-slate-900/40 hover:bg-blue-950/60 cursor-pointer transition">
                        <input type="radio" name="nguonGiaoRadio" value="Công việc đột xuất" onchange="xuLyThayDoiNguonGiao(this.value)" class="w-4 h-4 text-blue-500 focus:ring-blue-600">
                        <span class="text-xs font-semibold text-slate-200">Đột xuất</span>
                    </label>
                </div>
            </div>

            <!-- CARD CHỌN VĂN BẢN (Ẩn/Hiện linh hoạt) -->
            <div id="cardVanBan" class="bg-slate-800/80 backdrop-blur border border-blue-800/80 p-4 rounded-2xl shadow-md space-y-3">
                <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                    <i class="bi bi-file-earmark-text-fill text-blue-400"></i>
                    <span>Văn bản chỉ đạo từ Kho Văn bản</span>
                </label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="inputTimVanBan" placeholder="Nhập số VB, từ khóa, tên văn bản..." class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 pl-9 pr-3.5 py-2.5 text-sm font-medium text-slate-100 outline-none focus:border-blue-500 transition placeholder:text-slate-500">
                        <i class="bi bi-search absolute left-3 top-3 text-slate-500"></i>
                    </div>
                    <button type="button" onclick="timKiemVanBan()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl flex items-center gap-1.5 transition active:scale-95 shrink-0 shadow-sm">
                        <i class="bi bi-search"></i>
                        <span>Tìm kiếm</span>
                    </button>
                </div>

                <div id="vungKetQuaVanBan" class="hidden border border-blue-900/80 rounded-xl bg-slate-900 max-h-48 overflow-y-auto divide-y divide-slate-800 shadow-lg"></div>

                <div id="chiTietVanBanDaChon" class="p-3 bg-blue-950/40 rounded-xl border border-blue-800/50 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <div><span class="font-bold text-slate-400">Số VB:</span> <span id="lblSoVB" class="font-bold text-blue-300">Chưa chọn</span></div>
                    <div><span class="font-bold text-slate-400">Ngày BH:</span> <span id="lblNgayBH" class="text-slate-300">--/--/----</span></div>
                    <div class="sm:col-span-2"><span class="font-bold text-slate-400">Tên VB:</span> <span id="lblTenVB" class="text-slate-200 font-medium">Bấm tìm kiếm để chọn từ Kho Văn bản...</span></div>
                </div>
            </div>

            <!-- MỨC ĐỘ & LOẠI NHIỆM VỤ -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-1.5">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                        <i class="bi bi-exclamation-triangle-fill text-amber-400"></i>
                        <span>Mức độ ưu tiên</span>
                    </label>
                    <select id="mucDo" class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 px-3.5 py-2.5 text-sm font-medium text-slate-200 outline-none focus:border-blue-500">
                        <option value="Khẩn" class="bg-slate-900 text-red-400">🔴 Khẩn</option>
                        <option value="Quan trọng" class="bg-slate-900 text-amber-400">🟠 Quan trọng</option>
                        <option value="Bình thường" selected class="bg-slate-900 text-emerald-400">🟢 Bình thường</option>
                    </select>
                </div>

                <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-1.5">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                        <i class="bi bi-pin-angle-fill text-blue-400"></i>
                        <span>Loại nhiệm vụ</span>
                    </label>
                    <select id="loaiNhiemVu" class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 px-3.5 py-2.5 text-sm font-medium text-slate-200 outline-none focus:border-blue-500">
                        <option value="Chỉ đạo thường xuyên" class="bg-slate-900">Chỉ đạo thường xuyên</option>
                        <option value="Công việc khẩn" class="bg-slate-900">Công việc khẩn</option>
                        <option value="Thực hiện theo Văn bản" class="bg-slate-900">Thực hiện theo Văn bản</option>
                    </select>
                </div>
            </div>

            <!-- TIÊU ĐỀ & NỘI DUNG -->
            <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-1.5">
                <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                    <i class="bi bi-pencil-square text-blue-400"></i>
                    <span>Tiêu đề công việc</span>
                </label>
                <input type="text" id="tieuDe" required class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 px-3.5 py-2.5 text-sm font-medium text-slate-100 outline-none focus:border-blue-500 placeholder:text-slate-500" placeholder="Nhập tóm tắt tiêu đề...">
            </div>

            <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-1.5">
                <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                    <i class="bi bi-file-earmark-text-fill text-blue-400"></i>
                    <span>Nội dung chi tiết</span>
                </label>
                <textarea id="noiDung" rows="3" class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 px-3.5 py-2.5 text-sm font-medium text-slate-100 outline-none focus:border-blue-500 placeholder:text-slate-500" placeholder="Nội dung chỉ đạo chi tiết..."></textarea>
            </div>

            <!-- ĐỐI TƯỢNG NHẬN NHIỆM VỤ -->
            <div id="vungChonDoiTuong" class="bg-slate-800/80 backdrop-blur p-4 sm:p-5 rounded-2xl border border-blue-900/60 shadow-md space-y-4">

                <!-- Header & Thống kê Badge -->
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-blue-900/50">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-blue-900/60 border border-blue-700/50 flex items-center justify-center text-blue-400">
                            <i class="bi bi-people-fill text-sm"></i>
                        </div>
                        <label class="text-xs font-bold text-blue-300 uppercase tracking-wide">
                            Đối tượng nhận nhiệm vụ
                        </label>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <span id="badgeThongKeTo" class="px-2.5 py-1 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-800/60 text-[11px] font-bold">
                            0 tổ
                        </span>
                        <span id="badgeThongKeNguoi" class="px-2.5 py-1 rounded-lg bg-blue-950 text-blue-300 border border-blue-800/60 text-[11px] font-bold">
                            0 cá nhân
                        </span>
                    </div>
                </div>

                <!-- Thanh tìm kiếm -->
                <div class="relative group">
                    <i class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                    <input id="txtTimDoiTuong" type="text" oninput="timKiemDoiTuong(this.value)" placeholder="Tìm theo tên tổ hoặc giáo viên..." class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 pl-10 pr-4 py-2.5 text-xs outline-none focus:border-blue-500 transition placeholder:text-slate-500 text-slate-100">
                </div>

                <!-- Thanh công cụ hành động -->
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="expandAllTo()" class="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-blue-950 border border-blue-900/60 text-slate-300 hover:text-blue-300 text-[11px] font-semibold transition flex items-center gap-1.5">
                            <i class="bi bi-arrows-expand text-xs"></i>
                            <span>Mở tất cả</span>
                        </button>
                        <button type="button" onclick="collapseAllTo()" class="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-blue-900/60 text-slate-300 text-[11px] font-semibold transition flex items-center gap-1.5">
                            <i class="bi bi-arrows-collapse text-xs"></i>
                            <span>Thu gọn</span>
                        </button>
                    </div>

                    <button type="button" onclick="clearAllSelection()" class="px-2.5 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900/80 border border-red-800/50 text-red-300 text-[11px] font-semibold transition flex items-center gap-1.5">
                        <i class="bi bi-x-circle text-xs"></i>
                        <span>Bỏ chọn tất cả</span>
                    </button>
                </div>

                <!-- Accordion Danh sách tổ -->
                <div id="danhSachToAccordion" class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                    <div class="p-6 text-center text-xs text-slate-400 space-y-2">
                        <i class="bi bi-arrow-repeat animate-spin text-lg text-blue-400 inline-block"></i>
                        <div class="italic">Đang tải danh sách tổ...</div>
                    </div>
                </div>

                <!-- Vùng Tag đã chọn -->
                <div class="pt-3 border-t border-blue-900/50 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                            <i class="bi bi-check2-square text-blue-400"></i> Đã chọn
                        </span>
                        <button type="button" onclick="clearAllSelection()" class="text-[11px] font-medium text-red-400 hover:text-red-300 hover:underline transition">
                            Xóa tất cả
                        </button>
                    </div>

                    <div id="danhSachDaChon" class="p-2.5 bg-slate-900/80 rounded-xl border border-dashed border-blue-900/80 min-h-[52px] flex flex-wrap gap-1.5 items-center">
                        <span class="text-xs text-slate-500 italic px-1">Chưa chọn đối tượng nào...</span>
                    </div>
                </div>

                <!-- Thanh hành động Xác nhận & Chọn lại -->
                <div class="pt-3 border-t border-blue-900/50 space-y-2">
                    <div id="msgXacNhanDoiTuong" class="hidden p-2.5 bg-emerald-950/60 border border-emerald-700/60 rounded-xl flex items-center gap-2 text-xs text-emerald-300 font-semibold">
                        <i class="bi bi-check-circle-fill text-emerald-400"></i>
                        <span>Đã xác nhận danh sách đối tượng nhận nhiệm vụ!</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button type="button" id="btnXacNhanDoiTuong" onclick="confirmSelection()" class="flex-1 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer shadow-md">
                            <i class="bi bi-check-circle text-xs"></i>
                            <span>Xác nhận đối tượng</span>
                        </button>
                        <button type="button" id="btnChonLaiDoiTuong" onclick="editSelection()" disabled class="py-2 px-3 rounded-xl bg-slate-900 text-slate-500 border border-blue-900/40 text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-not-allowed">
                            <i class="bi bi-pencil-square text-xs"></i>
                            <span>Chọn lại</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- YÊU CẦU MINH CHỨNG & HẠN HOÀN THÀNH -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-1.5">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                        <i class="bi bi-check-circle-fill text-blue-400"></i>
                        <span>Yêu cầu minh chứng</span>
                    </label>
                    <select id="yeuCauMinhChung" class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 px-3.5 py-2.5 text-sm font-medium text-slate-200 outline-none focus:border-blue-500">
                        <option value="Không" selected class="bg-slate-900">Không yêu cầu</option>
                        <option value="Có" class="bg-slate-900">Có yêu cầu minh chứng/báo cáo</option>
                    </select>
                </div>

                <div class="bg-slate-800/80 backdrop-blur border border-blue-900/60 p-4 rounded-2xl shadow-md space-y-1.5">
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-300 uppercase tracking-wide">
                        <i class="bi bi-calendar-event-fill text-blue-400"></i>
                        <span>Hạn hoàn thành</span>
                    </label>
                    <input type="date" id="hanHoanThanh" class="w-full rounded-xl border border-blue-900/60 bg-slate-900/80 px-3.5 py-2.5 text-sm font-medium text-slate-200 outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- NÚT FIX BOTTOM -->
            <div class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-blue-900/60 p-3 sm:p-4 z-40 shadow-2xl">
                <div class="max-w-3xl mx-auto">
                    <button type="submit" id="btnSubmit" class="w-full h-12 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-bold text-base rounded-2xl shadow-lg flex items-center justify-center gap-2 transition-all border border-blue-400/30">
                        <i class="bi bi-send-fill"></i>
                        <span>Xác nhận Giao việc</span>
                    </button>
                </div>
            </div>

        </form>
    </main>

    <script>
    // =========================================================================
    // 1. CẤU HÌNH & BỘ NHỚ ĐỆM (CACHE)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7IsfWAfnsOa4SIyMiKEB-qQurwW5FpxuKcT83aeCHXhiAf60sJSc0t4KQXE3N427E/exec";

    let dsToData = [];
    let dsNhanSuLoadedByTo = {}; 
    let selectedObjects = [];     
    let vanBanChon = { soVanBan: '', tenVanBan: '' };
    let cachedVanBanResults = []; 
    let isLockedSelection = false;

    function safeId(str) {
        return String(str || '').replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    // =========================================================================
    // 2. KHỞI TẠO TRANG & TỰ TRUY XUẤT NGƯỜI GIAO
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async function() {
        loadThongTinNguoiGiao();
        await loadDanhSachTo();
    });

    function loadThongTinNguoiGiao() {
        const urlParams = new URLSearchParams(window.location.search);
        const paramUser = urlParams.get('user');
        const paramChucVu = urlParams.get('chucVu');

        let nguoiGiaoName = paramUser || localStorage.getItem('userFullName') || "Thầy Nguyễn Văn Thà";
        let chucVuVal = paramChucVu || localStorage.getItem('userPosition') || "Phó Hiệu trưởng";

        document.getElementById('nguoiGiao').value = nguoiGiaoName;
        document.getElementById('chucVuNguoiGiao').value = chucVuVal;
    }

    // =========================================================================
    // 3. TẢI DANH SÁCH TỔ & HIỂN THỊ ACCORDION
    // =========================================================================
    async function loadDanhSachTo() {
        const container = document.getElementById('danhSachToAccordion');
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getDanhSachTo`);
            if (!res.ok) throw new Error('HTTP Error ' + res.status);
            const data = await res.json();
            dsToData = Array.isArray(data) ? data : [];
            renderToAccordion();
        } catch (e) {
            console.error("Lỗi lấy danh sách tổ:", e);
            if (container) {
                container.innerHTML = '<div class="p-3 text-xs text-red-400 italic text-center">Không thể tải danh sách tổ. Vui lòng thử lại sau!</div>';
            }
        }
    }

    function renderToAccordion() {
        const container = document.getElementById('danhSachToAccordion');
        if (!container) return;
        container.innerHTML = '';

        if (!dsToData || dsToData.length === 0) {
            container.innerHTML = '<div class="p-3 text-xs text-slate-400 italic text-center">Không tìm thấy danh sách tổ.</div>';
            return;
        }

        dsToData.forEach(item => {
            const tenTo = item.tenTo;
            const sId = safeId(tenTo);
            const encodedTo = encodeURIComponent(tenTo);

            const div = document.createElement('div');
            div.id = `itemToCard-${sId}`;
            div.className = "to-card-item border border-blue-900/50 rounded-xl overflow-hidden bg-slate-900/60 shadow-sm transition";
            div.setAttribute('data-[#0F4C81]', tenTo.toLowerCase());
            div.innerHTML = `
                <div class="p-3 bg-slate-900/90 flex items-center justify-between text-xs font-bold text-blue-200">
                    <button type="button" onclick="toggleToAccordion('${encodedTo}')" class="flex-1 flex items-center gap-2 text-left">
                        <i id="iconTo-${sId}" class="bi bi-chevron-right text-slate-500 transition-transform"></i>
                        <i class="bi bi-folder2-open text-blue-400"></i>
                        <span>${tenTo}</span>
                        <span class="text-[10px] font-normal text-slate-400">(${item.soLuong || 0} người)</span>
                    </button>
                    <button type="button" onclick="chonTronTo('${encodedTo}')" class="px-2 py-1 bg-blue-950 hover:bg-blue-900 border border-blue-800/60 text-blue-300 rounded-lg text-[11px] font-semibold transition">
                        <i class="bi bi-check-all"></i> Chọn trọn tổ
                    </button>
                </div>
                <div id="bodyTo-${sId}" class="hidden p-3 bg-slate-950/60 border-t border-blue-900/40 space-y-2">
                    <div class="p-2 text-xs text-slate-400 italic text-center" id="loadingTo-${sId}">Đang tải nhân sự...</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 hidden" id="gridTo-${sId}"></div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function toggleToAccordion(tenToEncoded) {
        const tenTo = decodeURIComponent(tenToEncoded);
        const sId = safeId(tenTo);
        const body = document.getElementById(`bodyTo-${sId}`);
        const icon = document.getElementById(`iconTo-${sId}`);
        
        if (!body) return;

        if (body.classList.contains('hidden')) {
            body.classList.remove('hidden');
            if (icon) icon.classList.add('rotate-90');

            if (!dsNhanSuLoadedByTo[tenTo]) {
                await loadNhanSuCuaTo(tenTo);
            }
        } else {
            body.classList.add('hidden');
            if (icon) icon.classList.remove('rotate-90');
        }
    }

    async function loadNhanSuCuaTo(tenTo) {
        const sId = safeId(tenTo);
        const loading = document.getElementById(`loadingTo-${sId}`);
        const grid = document.getElementById(`gridTo-${sId}`);

        try {
            const res = await fetch(`${SCRIPT_URL}?action=getNhanSuTheoTo&to=${encodeURIComponent(tenTo)}`);
            if (!res.ok) throw new Error('HTTP Error ' + res.status);
            
            const listNS = await res.json();
            const cleanList = Array.isArray(listNS) ? listNS : [];
            dsNhanSuLoadedByTo[tenTo] = cleanList;

            if (loading) loading.classList.add('hidden');
            if (!grid) return;
            
            grid.classList.remove('hidden');

            if (cleanList.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-xs text-slate-500 italic p-2 text-center">Không có dữ liệu nhân sự.</div>';
                return;
            }

            renderNhanSuGrid(tenTo);
        } catch (e) {
            console.error("Lỗi load nhân sự tổ:", e);
            if (loading) {
                loading.innerText = 'Không thể tải danh sách nhân sự.';
                loading.classList.remove('hidden');
            }
        }
    }

    function renderNhanSuGrid(tenTo) {
        const sId = safeId(tenTo);
        const grid = document.getElementById(`gridTo-${sId}`);
        if (!grid) return;

        const cleanList = dsNhanSuLoadedByTo[tenTo] || [];
        const isToAlreadySelected = selectedObjects.some(x => x.toBoPhan === tenTo && x.loai === 'TO');

        grid.innerHTML = cleanList.map(ns => {
            const username = ns.username || '';
            const hoTen = ns.hoTen || '';
            const isChecked = isToAlreadySelected || selectedObjects.some(x => x.username === username && x.loai === 'CANHAN');
            const encodedTo = encodeURIComponent(tenTo);
            const encodedName = encodeURIComponent(hoTen);
            const encodedUser = encodeURIComponent(username);

            return `
                <label class="ns-item flex items-center space-x-2.5 p-2 rounded-xl bg-slate-900/90 hover:bg-blue-950/60 cursor-pointer border border-blue-900/40 transition shadow-sm" data-name="${hoTen.toLowerCase()}">
                    <input type="checkbox" 
                           data-username="${username}" 
                           data-hoten="${hoTen}" 
                           data-tobophan="${tenTo}" 
                           ${isChecked ? 'checked' : ''} 
                           ${isLockedSelection ? 'disabled' : ''}
                           onchange="toggleChonCaNhan(this, '${encodedUser}', '${encodedName}', '${encodedTo}')" 
                           class="w-4 h-4 text-blue-600 rounded border-slate-700 bg-slate-800 focus:ring-blue-500">
                    <span class="text-xs font-semibold text-slate-200">${hoTen}</span>
                    <span class="text-[10px] text-slate-400">(${ns.vaiTro || 'Thành viên'})</span>
                </label>
            `;
        }).join('');
    }

    // =========================================================================
    // 4. THAO TÁC CHỌN TỔ, CÁ NHÂN VÀ HIỂN THỊ TAG
    // =========================================================================
    function chonTronTo(tenToEncoded) {
        if (isLockedSelection) return;
        const tenTo = decodeURIComponent(tenToEncoded);
        
        if (!selectedObjects.some(x => x.toBoPhan === tenTo && x.loai === 'TO')) {
            selectedObjects.push({ username: '', hoTen: `Tổ ${tenTo}`, toBoPhan: tenTo, loai: 'TO' });
        }

        const sId = safeId(tenTo);
        const grid = document.getElementById(`gridTo-${sId}`);
        if (grid) {
            const checkboxes = grid.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => { cb.checked = true; });
        }

        updateTagDisplay();
    }

    function toggleChonCaNhan(cb, usernameEncoded, hoTenEncoded, toBoPhanEncoded) {
        if (isLockedSelection) return;
        const username = decodeURIComponent(usernameEncoded);
        const hoTen = decodeURIComponent(hoTenEncoded);
        const toBoPhan = decodeURIComponent(toBoPhanEncoded);

        if (cb.checked) {
            if (!selectedObjects.some(x => x.username === username && x.loai === 'CANHAN')) {
                selectedObjects.push({ username, hoTen, toBoPhan, loai: 'CANHAN' });
            }
        } else {
            selectedObjects = selectedObjects.filter(x => !(x.username === username && x.loai === 'CANHAN'));
            selectedObjects = selectedObjects.filter(x => !(x.toBoPhan === toBoPhan && x.loai === 'TO'));
        }
        updateTagDisplay();
    }

    function updateTagDisplay() {
        const container = document.getElementById('danhSachDaChon');
        const badgeNguoi = document.getElementById('badgeThongKeNguoi');
        const badgeTo = document.getElementById('badgeThongKeTo');

        if (!container) return;

        const countTo = selectedObjects.filter(x => x.loai === 'TO').length;
        const countNguoi = selectedObjects.filter(x => x.loai === 'CANHAN').length;

        if (badgeTo) badgeTo.innerText = `${countTo} tổ`;
        if (badgeNguoi) badgeNguoi.innerText = `${countNguoi} cá nhân`;

        if (selectedObjects.length === 0) {
            container.innerHTML = '<span class="text-xs text-slate-500 italic px-1">Chưa chọn đối tượng nào...</span>';
            return;
        }

        container.innerHTML = selectedObjects.map((item, idx) => `
            <span class="px-2.5 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm ${item.loai === 'TO' ? 'bg-indigo-950 text-indigo-200 border border-indigo-700/60' : 'bg-blue-950 text-blue-200 border border-blue-700/60'}">
                <i class="bi ${item.loai === 'TO' ? 'bi-diagram-3-fill' : 'bi-person-fill'}"></i>
                ${item.hoTen}
                ${!isLockedSelection ? `<i class="bi bi-x-circle-fill text-slate-400 hover:text-red-400 cursor-pointer" onclick="removeSelected(${idx})"></i>` : ''}
            </span>
        `).join('');
    }

    function removeSelected(idx) {
        if (isLockedSelection) return;
        selectedObjects.splice(idx, 1);
        updateTagDisplay();
    }

    // =========================================================================
    // 5. TÌM KIẾM DỮ LIỆU & THAO TÁC NHANH
    // =========================================================================
    function timKiemDoiTuong(keyword) {
        const q = String(keyword || '').toLowerCase().trim();
        const cards = document.querySelectorAll('.to-card-item');

        cards.forEach(card => {
            const tenTo = card.getAttribute('data-[#0F4C81]') || '';
            let hasMatch = tenTo.includes(q);

            const nsItems = card.querySelectorAll('.ns-item');
            nsItems.forEach(ns => {
                const name = ns.getAttribute('data-name') || '';
                if (name.includes(q)) {
                    hasMatch = true;
                    ns.classList.remove('hidden');
                } else if (q !== '') {
                    ns.classList.add('hidden');
                } else {
                    ns.classList.remove('hidden');
                }
            });

            if (q === '' || hasMatch) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    async function expandAllTo() {
        for (const item of dsToData) {
            const tenTo = item.tenTo;
            const sId = safeId(tenTo);
            const body = document.getElementById(`bodyTo-${sId}`);
            const icon = document.getElementById(`iconTo-${sId}`);
            if (body) {
                body.classList.remove('hidden');
                if (icon) icon.classList.add('rotate-90');
                if (!dsNhanSuLoadedByTo[tenTo]) {
                    await loadNhanSuCuaTo(tenTo);
                }
            }
        }
    }

    function collapseAllTo() {
        dsToData.forEach(item => {
            const sId = safeId(item.tenTo);
            const body = document.getElementById(`bodyTo-${sId}`);
            const icon = document.getElementById(`iconTo-${sId}`);
            if (body) {
                body.classList.add('hidden');
                if (icon) icon.classList.remove('rotate-90');
            }
        });
    }

    function clearAllSelection() {
        if (isLockedSelection) return;
        selectedObjects = [];
        const checkboxes = document.querySelectorAll('#danhSachToAccordion input[type="checkbox"]');
        checkboxes.forEach(cb => { cb.checked = false; });
        updateTagDisplay();
    }

    function confirmSelection() {
        if (selectedObjects.length === 0) {
            alert('Vui lòng chọn ít nhất 1 tổ hoặc cá nhân nhận nhiệm vụ!');
            return;
        }

        isLockedSelection = true;
        document.getElementById('msgXacNhanDoiTuong').classList.remove('hidden');
        
        const btnConfirm = document.getElementById('btnXacNhanDoiTuong');
        const btnEdit = document.getElementById('btnChonLaiDoiTuong');

        btnConfirm.disabled = true;
        btnConfirm.className = "py-2 px-3 rounded-xl bg-slate-800 text-slate-500 border border-blue-900/40 text-xs font-semibold cursor-not-allowed";
        
        btnEdit.disabled = false;
        btnEdit.className = "py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white border border-blue-400/30 text-xs font-semibold transition cursor-pointer shadow-md";

        updateTagDisplay();
    }

    function editSelection() {
        isLockedSelection = false;
        document.getElementById('msgXacNhanDoiTuong').classList.add('hidden');

        const btnConfirm = document.getElementById('btnXacNhanDoiTuong');
        const btnEdit = document.getElementById('btnChonLaiDoiTuong');

        btnConfirm.disabled = false;
        btnConfirm.className = "flex-1 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer shadow-md";

        btnEdit.disabled = true;
        btnEdit.className = "py-2 px-3 rounded-xl bg-slate-900 text-slate-500 border border-blue-900/40 text-xs font-semibold cursor-not-allowed";

        updateTagDisplay();
    }

    // =========================================================================
    // 6. KHO VĂN BẢN VÀ NGUỒN GIAO
    // =========================================================================
    function xuLyThayDoiNguonGiao(val) {
        const card = document.getElementById('cardVanBan');
        if (!card) return;
        
        if (val === 'Theo văn bản') {
            card.classList.remove('hidden');
        } else {
            card.classList.add('hidden');
            vanBanChon = { soVanBan: '', tenVanBan: '' };
        }
    }

    async function timKiemVanBan() {
        const q = document.getElementById('inputTimVanBan').value.trim();
        const vung = document.getElementById('vungKetQuaVanBan');
        if (!vung) return;

        vung.classList.remove('hidden');
        vung.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center"><i class="bi bi-arrow-repeat animate-spin"></i> Đang tra cứu Kho Văn bản...</div>';

        try {
            const res = await fetch(`${SCRIPT_URL}?action=searchVanBan&q=${encodeURIComponent(q)}`);
            if (!res.ok) throw new Error('HTTP Error ' + res.status);
            
            const list = await res.json();
            cachedVanBanResults = Array.isArray(list) ? list : [];

            if (cachedVanBanResults.length === 0) {
                vung.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Không tìm thấy văn bản phù hợp.</div>';
                return;
            }

            vung.innerHTML = cachedVanBanResults.map((item, idx) => `
                <div onclick="selectVanBanByIndex(${idx})" class="p-2.5 hover:bg-blue-950/80 cursor-pointer text-xs border-b border-slate-800 last:border-0 transition">
                    <div class="font-bold text-blue-300">${item.soVanBan || 'Không số'}</div>
                    <div class="text-slate-200 truncate font-medium">${item.tenVanBan || ''}</div>
                    <div class="text-[10px] text-slate-400">${item.donViBanHanh || ''} ${item.ngayBanHanh ? ' - ' + item.ngayBanHanh : ''}</div>
                </div>
            `).join('');
        } catch (e) {
            console.error("Lỗi tìm văn bản:", e);
            vung.innerHTML = '<div class="p-3 text-xs text-red-400 text-center">Lỗi khi kết nối Kho Văn bản.</div>';
        }
    }

    function selectVanBanByIndex(index) {
        const item = cachedVanBanResults[index];
        if (!item) return;

        vanBanChon = item;
        const lblSoVB = document.getElementById('lblSoVB');
        const lblNgayBH = document.getElementById('lblNgayBH');
        const lblTenVB = document.getElementById('lblTenVB');
        const vung = document.getElementById('vungKetQuaVanBan');

        if (lblSoVB) lblSoVB.innerText = item.soVanBan || 'Không số';
        if (lblNgayBH) lblNgayBH.innerText = item.ngayBanHanh || '--/--/----';
        if (lblTenVB) lblTenVB.innerText = item.tenVanBan || '';
        if (vung) vung.classList.add('hidden');
    }

    // =========================================================================
    // 7. GỬI DỮ LIỆU GIAO VIỆC (SUBMIT FORM)
    // =========================================================================
    document.getElementById('formGiaoViecFull').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (selectedObjects.length === 0) {
            alert('Vui lòng chọn ít nhất một tổ hoặc cá nhân nhận nhiệm vụ!');
            return;
        }

        const tieuDeVal = document.getElementById('tieuDe').value.trim();
        if (!tieuDeVal) {
            alert('Vui lòng nhập tiêu đề công việc!');
            document.getElementById('tieuDe').focus();
            return;
        }

        const btn = document.getElementById('btnSubmit');
        const originalBtnText = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = `<i class="bi bi-arrow-repeat animate-spin"></i> <span>Đang lưu dữ liệu...</span>`;

        const nguonGiaoVal = document.querySelector('input[name="nguonGiaoRadio"]:checked')?.value || 'Theo văn bản';

        const payload = {
            action: 'createTask',
            nguoiGiao: document.getElementById('nguoiGiao').value,
            chucVuNguoiGiao: document.getElementById('chucVuNguoiGiao').value,
            loaiNhiemVu: document.getElementById('loaiNhiemVu').value,
            nguonGiao: nguonGiaoVal,
            soVanBan: nguonGiaoVal === 'Theo văn bản' ? (vanBanChon.soVanBan || '') : '',
            tenVanBan: nguonGiaoVal === 'Theo văn bản' ? (vanBanChon.tenVanBan || '') : '',
            mucDo: document.getElementById('mucDo').value,
            tieuDe: tieuDeVal,
            noiDung: document.getElementById('noiDung').value.trim(),
            yeuCauMinhChung: document.getElementById('yeuCauMinhChung').value,
            hanHoanThanh: document.getElementById('hanHoanThanh').value,
            danhSachNguoiNhan: selectedObjects
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            alert('Giao nhiệm vụ thành công! Dữ liệu đã được lưu trữ.');
            window.location.href = 'main.html';
        } catch (err) {
            console.error("Lỗi gửi createTask:", err);
            alert('Có lỗi xảy ra khi gửi dữ liệu. Vui lòng kiểm tra lại kết nối!');
            btn.disabled = false;
            btn.innerHTML = originalBtnText;
        }
    });
</script>
</body>
</html>
