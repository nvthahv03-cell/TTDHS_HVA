    <script>
        // URL Apps Script lấy từ dự án
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjq11TcDE4tyOsPl6NOw1q6r8f14r3Z3qQPuSAgic7Xf6XK4gXjwHOBem4I_IGnALZ/exec";

        let dsToData = [];
        let dsNhanSuLoadedByTo = {}; // CachedLazy
        let selectedObjects = []; // Mảng chứa các đối tượng đã chọn {username, hoTen, toBoPhan, loai}
        let vanBanChon = { soVanBan: '', tenVanBan: '' };

        window.addEventListener('DOMContentLoaded', async function() {
            await loadDanhSachTo();
        });

        // 1. Gọi API getDanhSachTo
        async function loadDanhSachTo() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getDanhSachTo`);
                dsToData = await res.json();
                renderToAccordion();
            } catch (e) {
                console.error("Lỗi lấy danh sách tổ:", e);
            }
        }

        // Render Accordion danh sách các tổ
        function renderToAccordion() {
            const container = document.getElementById('danhSachToAccordion');
            container.innerHTML = '';

            if (!dsToData || dsToData.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 italic p-2">Không tìm thấy danh sách tổ.</div>';
                return;
            }

            dsToData.forEach(item => {
                const tenTo = item.tenTo;
                const div = document.createElement('div');
                div.className = "border border-slate-200/80 rounded-xl overflow-hidden bg-white shadow-sm";
                div.innerHTML = `
                    <div class="p-3 bg-slate-50/50 flex items-center justify-between text-xs font-bold text-[#0F4C81]">
                        <button type="button" onclick="toggleToAccordion('${tenTo}')" class="flex-1 flex items-center gap-2 text-left">
                            <i id="iconTo-${tenTo}" class="bi bi-chevron-right text-slate-400 transition-transform"></i>
                            <i class="bi bi-folder2-open text-blue-500"></i>
                            <span>${tenTo}</span>
                            <span class="text-[10px] font-normal text-slate-400">(${item.soLuong} người)</span>
                        </button>
                        <button type="button" onclick="chonTronTo('${tenTo}')" class="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-[11px] font-semibold transition">
                            <i class="bi bi-check-all"></i> Chọn trọn tổ
                        </button>
                    </div>
                    <div id="bodyTo-${tenTo}" class="hidden p-3 bg-blue-50/10 border-t border-slate-100">
                        <div class="p-2 text-xs text-slate-400 italic" id="loadingTo-${tenTo}">Đang tải nhân sự...</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 hidden" id="gridTo-${tenTo}"></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 2. Mở/Đóng Accordion & Gọi getNhanSuTheoTo (Lazy Load)
        async function toggleToAccordion(tenTo) {
            const body = document.getElementById(`bodyTo-${tenTo}`);
            const icon = document.getElementById(`iconTo-${tenTo}`);
            
            if (body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                if (icon) icon.classList.add('rotate-90');

                // Nếu chưa load thì gọi API
                if (!dsNhanSuLoadedByTo[tenTo]) {
                    await loadNhanSuCuaTo(tenTo);
                }
            } else {
                body.classList.add('hidden');
                if (icon) icon.classList.remove('rotate-90');
            }
        }

        async function loadNhanSuCuaTo(tenTo) {
            const loading = document.getElementById(`loadingTo-${tenTo}`);
            const grid = document.getElementById(`gridTo-${tenTo}`);

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getNhanSuTheoTo&to=${encodeURIComponent(tenTo)}`);
                const listNS = await res.json();
                dsNhanSuLoadedByTo[tenTo] = listNS;

                loading.classList.add('hidden');
                grid.classList.remove('hidden');

                grid.innerHTML = listNS.map(ns => {
                    const isChecked = selectedObjects.some(x => x.username === ns.username && x.loai === 'CANHAN');
                    return `
                        <label class="flex items-center space-x-2.5 p-2 rounded-xl bg-white hover:bg-blue-50/50 cursor-pointer border border-slate-200/60 transition shadow-sm">
                            <input type="checkbox" data-username="${ns.username}" data-hoten="${ns.hoTen}" data-[#0F4C81]="${tenTo}" ${isChecked ? 'checked' : ''} onchange="toggleChonCaNhan(this, '${ns.username}', '${ns.hoTen}', '${tenTo}')" class="w-4 h-4 text-[#0F4C81] rounded border-slate-300">
                            <span class="text-xs font-semibold text-slate-700">${ns.hoTen}</span>
                            <span class="text-[10px] text-slate-400">(${ns.vaiTro || 'Thành viên'})</span>
                        </label>
                    `;
                }).join('');
            } catch (e) {
                loading.innerText = 'Lỗi tải danh sách nhân sự.';
            }
        }

        function chonTronTo(tenTo) {
            // Thêm đối tượng Tổ
            if (!selectedObjects.some(x => x.toBoPhan === tenTo && x.loai === 'TO')) {
                selectedObjects.push({ username: '', hoTen: `Tổ ${tenTo}`, toBoPhan: tenTo, loai: 'TO' });
            }
            updateTagDisplay();
        }

        function toggleChonCaNhan(cb, username, hoTen, toBoPhan) {
            if (cb.checked) {
                if (!selectedObjects.some(x => x.username === username && x.loai === 'CANHAN')) {
                    selectedObjects.push({ username, hoTen, toBoPhan, loai: 'CANHAN' });
                }
            } else {
                selectedObjects = selectedObjects.filter(x => !(x.username === username && x.loai === 'CANHAN'));
            }
            updateTagDisplay();
        }

        function updateTagDisplay() {
            const container = document.getElementById('danhSachDaChon');
            const badgeNguoi = document.getElementById('badgeThongKeNguoi');
            const badgeTo = document.getElementById('badgeThongKeTo');

            const countTo = selectedObjects.filter(x => x.loai === 'TO').length;
            const countNguoi = selectedObjects.filter(x => x.loai === 'CANHAN').length;

            badgeTo.innerText = `${countTo} tổ`;
            badgeNguoi.innerText = `${countNguoi} cá nhân`;

            if (selectedObjects.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400 italic">Chưa chọn đối tượng nào...</span>';
                return;
            }

            container.innerHTML = selectedObjects.map((item, idx) => `
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm ${item.loai === 'TO' ? 'bg-indigo-50 text-indigo-800 border border-indigo-200' : 'bg-white text-[#0F4C81] border border-blue-200'}">
                    <i class="bi ${item.loai === 'TO' ? 'bi-diagram-3-fill' : 'bi-person-fill'}"></i>
                    ${item.hoTen}
                    <i class="bi bi-x-circle-fill text-slate-400 hover:text-red-500 cursor-pointer" onclick="removeSelected(${idx})"></i>
                </span>
            `).join('');
        }

        function removeSelected(idx) {
            selectedObjects.splice(idx, 1);
            updateTagDisplay();
        }

        // 3. Xử lý Nguồn giao & Tra cứu Văn bản
        function xuLyThayDoiNguonGiao(val) {
            const card = document.getElementById('cardVanBan');
            if (val === 'Theo văn bản') {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
                vanBanChon = { soVanBan: '', tenVanBan: '' };
            }
        }

        async function timKiemVanBan() {
            const q = document.getElementById('inputTimVanBan').value.trim();
            const vung = document.getElementById('vungKetQuaVanBan');
            vung.classList.remove('hidden');
            vung.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Đang tra cứu Kho Văn bản...</div>';

            try {
                const res = await fetch(`${SCRIPT_URL}?action=searchVanBan&q=${encodeURIComponent(q)}`);
                const list = await res.json();

                if (!list || list.length === 0) {
                    vung.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Không thấy văn bản.</div>';
                    return;
                }

                vung.innerHTML = list.map(item => `
                    <div onclick='selectVanBan(${JSON.stringify(item)})' class="p-2.5 hover:bg-blue-50 cursor-pointer text-xs">
                        <div class="font-bold text-[#0F4C81]">${item.soVanBan}</div>
                        <div class="text-slate-800 truncate">${item.tenVanBan}</div>
                    </div>
                `).join('');
            } catch (e) {
                vung.innerHTML = '<div class="p-3 text-xs text-red-500 text-center">Lỗi tìm văn bản.</div>';
            }
        }

        function selectVanBan(item) {
            vanBanChon = item;
            document.getElementById('lblSoVB').innerText = item.soVanBan || 'Không số';
            document.getElementById('lblNgayBH').innerText = item.ngayBanHanh || '--/--/----';
            document.getElementById('lblTenVB').innerText = item.tenVanBan || '';
            document.getElementById('vungKetQuaVanBan').classList.add('hidden');
        }

        // 4. SUBMIT FORM createTask
        document.getElementById('formGiaoViecFull').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (selectedObjects.length === 0) {
                alert('Vui lòng chọn ít nhất một cá nhân hoặc tổ nhận nhiệm vụ!');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Đang lưu...";

            const payload = {
                action: 'createTask',
                nguoiGiao: document.getElementById('nguoiGiao').value,
                chucVuNguoiGiao: document.getElementById('chucVuNguoiGiao').value,
                loaiNhiemVu: document.getElementById('loaiNhiemVu').value,
                nguonGiao: document.querySelector('input[name="nguonGiaoRadio"]:checked').value,
                soVanBan: vanBanChon.soVanBan || '',
                tenVanBan: vanBanChon.tenVanBan || '',
                mucDo: document.getElementById('mucDo').value,
                tieuDe: document.getElementById('tieuDe').value,
                noiDung: document.getElementById('noiDung').value,
                yeuCauMinhChung: document.getElementById('yeuCauMinhChung').value,
                hanHoanThanh: document.getElementById('hanHoanThanh').value,
                danhSachNguoiNhan: selectedObjects
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert('Giao nhiệm vụ thành công! Dữ liệu đã ghi chuẩn vào 01_CONGVIEC, 02_NGUOINHAN, 03_NHATKY.');
                window.location.href = 'main.html';
            } catch (err) {
                alert('Lỗi khi gửi dữ liệu!');
            } finally {
                btn.disabled = false;
                btn.innerText = "Xác nhận Giao việc";
            }
        });
    </script>
</body>
</html>
