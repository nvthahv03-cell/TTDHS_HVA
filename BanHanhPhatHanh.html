<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ban hành – Phát hành | TTĐHS HVA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172033;font:14px Arial,sans-serif}.app{max-width:1120px;margin:20px auto;padding:0 14px}.head,.card{background:#fff;border:1px solid #dbe5f1;border-radius:14px;box-shadow:0 4px 18px #17345d12}.head{padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}.head h1{margin:0;color:#0b4d8c;font-size:22px}.sub{margin-top:5px;color:#66758a}.user{text-align:right;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{padding:18px}.wide{grid-column:1/-1}.ttl{font-weight:800;color:#0b4d8c;font-size:15px;margin-bottom:12px}.scope,.source{display:flex;gap:10px;flex-wrap:wrap}.choice{border:1px solid #c9d7e8;background:#fff;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.choice.on{border-color:#0b67b2;background:#eef7ff;color:#075a9e}.panel{margin-top:12px;padding:14px;border:1px solid #dce7f2;border-radius:10px;background:#fbfdff}input,select,textarea{width:100%;border:1px solid #cbd8e7;border-radius:9px;padding:10px;background:#fff;font:inherit}textarea{min-height:86px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search{display:flex;gap:8px}.search input{flex:1}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;background:#0b67b2;color:#fff}.btn.ghost{background:#eef4fb;color:#164d7e}.btn.green{background:#177245}.result{margin-top:10px;max-height:260px;overflow:auto}.doc{border:1px solid #dbe5ef;border-radius:9px;padding:10px;margin:7px 0;background:#fff;display:flex;justify-content:space-between;gap:10px}.doc b{display:block;margin-bottom:4px}.meta{font-size:12px;color:#68788c}.docBtns{display:flex;gap:6px;align-items:center;white-space:nowrap}.mini{border:1px solid #bdd0e4;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;color:#15568e}.selected{border:1px solid #9ac7a9;background:#f1fbf4;border-radius:9px;padding:11px;margin-top:10px}.people{max-height:220px;overflow:auto;border:1px solid #dce7f2;border-radius:9px;padding:8px}.person{display:flex;gap:8px;align-items:center;padding:6px}.person input{width:auto}.status{margin-top:12px;padding:10px;border-radius:9px;background:#eef6ff;color:#174f7d;display:none}.status.err{background:#fff0f0;color:#a32d2d}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.head{align-items:flex-start}.user{display:none}.doc{display:block}.docBtns{margin-top:8px}}
</style></head><body><div class="app">
<div class="head"><div><h1>BAN HÀNH – PHÁT HÀNH</h1><div class="sub">TTĐHS HVA · Một văn bản – một file gốc – phát hành nhiều lần</div></div><div class="user"><div id="userName"></div><div class="sub" id="userRole"></div></div></div>
<div class="grid">
<div class="card"><div class="ttl">1. PHẠM VI PHÁT HÀNH</div><div class="scope"><button id="scSchool" class="choice" onclick="setScope('SCHOOL')">🏫 Nhà trường</button><button id="scTeam" class="choice" onclick="setScope('TEAM')">👥 Tổ/Bộ phận</button></div><div class="panel"><label>Loại văn bản</label><select id="docType" style="margin-top:6px"></select><div id="teamIssuerBox" style="margin-top:10px;display:none"><label>Tổ/Bộ phận phát hành</label><select id="issuerTeam" onchange="issuerChanged()" style="margin-top:6px"></select></div></div></div>
<div class="card"><div class="ttl">2. ĐỐI TƯỢNG NHẬN</div><label>Tổ/Bộ phận nhận</label><select id="recipientTeam" onchange="loadRecipients()" style="margin-top:6px"></select><div style="margin:10px 0 6px"><label><input type="checkbox" id="allPeople" checked onchange="toggleAll()" style="width:auto"> Chọn tất cả</label></div><div id="recipientArea" class="people">Chọn Tổ/Bộ phận để tải danh sách.</div></div>
<div class="card wide"><div class="ttl">3. VĂN BẢN PHÁT HÀNH</div><div class="source"><button id="srcKho" class="choice on" onclick="setSource('KHO')">🔎 TỪ KHO VĂN BẢN HVA</button><button id="srcUpload" class="choice" onclick="setSource('UPLOAD')">📤 TẢI VĂN BẢN LÊN</button></div>
<div id="khoPanel" class="panel"><div class="search"><input id="q" placeholder="Nhập số văn bản, từ khóa hoặc tên file..." onkeydown="if(event.key==='Enter')searchKho()"><button class="btn" onclick="searchKho()">Tìm</button></div><div id="results" class="result"></div></div>
<div id="uploadPanel" class="panel" style="display:none"><div class="row"><div><label>Đưa file gốc vào</label><select id="folderKey" style="margin-top:6px"><option value="DOCUMENT_IN">Văn bản đến</option><option value="DOCUMENT_OUT">Văn bản đi</option></select></div><div><label>Chọn PDF</label><input id="pdfFile" type="file" accept="application/pdf,.pdf" style="margin-top:6px" onchange="fileChanged()"></div></div><div class="sub" style="margin-top:8px">Hệ thống kiểm tra trùng trước khi đưa file vào Kho. File đã có sẽ không được tạo thêm.</div></div>
<div id="selectedDoc"></div></div>
<div class="card wide"><div class="ttl">4. NỘI DUNG PHÁT HÀNH</div><div class="row"><div><label>Năm học</label><input id="schoolYear" value="2026–2027" style="margin-top:6px"></div><div><label>Tiêu đề hiển thị</label><input id="title" placeholder="Tự lấy từ tên văn bản; có thể chỉnh" style="margin-top:6px"></div></div><label style="display:block;margin-top:10px">Nội dung thông báo</label><textarea id="message" style="margin-top:6px" placeholder="Đề nghị Thầy/Cô xem văn bản và thực hiện theo nội dung được ban hành/phát hành."></textarea><div id="status" class="status"></div><div class="actions"><button class="btn ghost" onclick="previewSelected()">👁 Mở văn bản</button><button id="publishBtn" class="btn green" onclick="publishNow()">✓ Phát hành</button></div></div>
</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzj-6VHIUrnRfIBvzpM2R9ImU3Ikov8C49xNfB8JhcrN9kJTSBqwRgK63fea_Jbyr4U/exec';
let CURRENT_USER={},SCOPE='SCHOOL',SOURCE='KHO',SELECTED_DOC=null,PEOPLE=[];
function user(){try{return JSON.parse(sessionStorage.getItem('user')||localStorage.getItem('user')||'{}')}catch(e){return {}}}
function norm(v){return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function teamOf(u){return u.department||u.toBoPhan||u.to||''}function roleOf(u){return [u.role,u.vaiTro,u.workPosition,u.chucVu,u.permissions,u.quyen].filter(Boolean).join(' ')}
function schoolManager(u){return /hieu truong|pho hieu truong|bgh|admin|quan tri/.test(norm(roleOf(u)))}
function manager(u){return schoolManager(u)||/ttcm|ttvp|to truong|truong to/.test(norm(roleOf(u)))}
function unwrap(x){return Array.isArray(x)?x:(Array.isArray(x?.data)?x.data:[])}
function status(t,err=false){const e=document.getElementById('status');e.textContent=t;e.className='status'+(err?' err':'');e.style.display='block'}
async function init(){CURRENT_USER=user();document.getElementById('userName').textContent=CURRENT_USER.fullName||CURRENT_USER.hoTen||CURRENT_USER.username||'';document.getElementById('userRole').textContent=roleOf(CURRENT_USER);if(!manager(CURRENT_USER)){alert('Tài khoản chưa được cấp quyền Ban hành – Phát hành.');history.back();return}await loadTeams();setScope(schoolManager(CURRENT_USER)?'SCHOOL':'TEAM');}
async function loadTeams(){const r=await fetch(API+'?action=getDanhSachTo&_='+Date.now(),{cache:'no-store'});const a=unwrap(await r.json());const names=a.map(x=>x.tenTo||x.to||x.name||x).filter(Boolean);['issuerTeam','recipientTeam'].forEach(id=>{const s=document.getElementById(id);s.innerHTML='<option value="">— Vui lòng chọn —</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('')});}
function setScope(v){if(v==='SCHOOL'&&!schoolManager(CURRENT_USER))return status('TTCM/TTVP chỉ phát hành trong phạm vi Tổ/Bộ phận.',true);SCOPE=v;document.getElementById('scSchool').classList.toggle('on',v==='SCHOOL');document.getElementById('scTeam').classList.toggle('on',v==='TEAM');document.getElementById('teamIssuerBox').style.display=v==='TEAM'?'block':'none';if(v==='TEAM'){document.getElementById('issuerTeam').value=teamOf(CURRENT_USER);document.getElementById('issuerTeam').disabled=!schoolManager(CURRENT_USER);document.getElementById('recipientTeam').value=teamOf(CURRENT_USER);loadRecipients()}fillTypes();}
function fillTypes(){document.getElementById('docType').innerHTML=SCOPE==='SCHOOL'?'<option value="QUYET_DINH">Quyết định</option><option value="KE_HOACH_TRUONG">Kế hoạch của trường</option><option value="THONG_BAO_TRUONG">Thông báo của trường</option><option value="VAN_BAN_KHAC">Văn bản khác</option>':'<option value="KE_HOACH_THANG_TO">Kế hoạch tháng của tổ</option><option value="KE_HOACH_TO">Kế hoạch của tổ</option><option value="THONG_BAO_TO">Thông báo của tổ</option><option value="VAN_BAN_KHAC">Văn bản khác</option>'}
function issuerChanged(){if(SCOPE==='TEAM'){document.getElementById('recipientTeam').value=document.getElementById('issuerTeam').value;loadRecipients()}}
function setSource(v){SOURCE=v;SELECTED_DOC=null;document.getElementById('srcKho').classList.toggle('on',v==='KHO');document.getElementById('srcUpload').classList.toggle('on',v==='UPLOAD');document.getElementById('khoPanel').style.display=v==='KHO'?'block':'none';document.getElementById('uploadPanel').style.display=v==='UPLOAD'?'block':'none';renderSelected()}
async function searchKho(){const q=document.getElementById('q').value.trim();if(!q)return status('Nhập từ khóa cần tìm.',true);const box=document.getElementById('results');box.innerHTML='Đang tìm trong Kho mới...';try{const r=await fetch(API+'?action=searchKhoVanBanNew&q='+encodeURIComponent(q)+'&_='+Date.now(),{cache:'no-store'});const a=unwrap(await r.json());box.innerHTML=a.length?a.map((d,i)=>`<div class="doc"><div><b>${esc(d.tenVanBan||d.fileName)}</b><div class="meta">${esc(d.loaiKho||'')} · ${esc(d.fileName||'')}</div></div><div class="docBtns"><button class="mini" onclick="openUrl('${js(d.fileUrl)}')">Mở</button><button class="mini" onclick="openUrl('${js(d.downloadUrl)}')">Tải</button><button class="mini" onclick="chooseDoc(${i})">Chọn</button></div></div>`).join(''):'Không tìm thấy văn bản phù hợp.';window.__KHO_RESULTS=a}catch(e){box.textContent='Lỗi tìm Kho: '+e.message}}
function chooseDoc(i){SELECTED_DOC=(window.__KHO_RESULTS||[])[i]||null;if(SELECTED_DOC&&!document.getElementById('title').value)document.getElementById('title').value=SELECTED_DOC.tenVanBan||'';renderSelected()}
async function fileChanged(){const f=document.getElementById('pdfFile').files?.[0];SELECTED_DOC=null;renderSelected();if(!f)return;if(!/\.pdf$/i.test(f.name))return status('Chỉ nhận file PDF.',true);status('Đang kiểm tra trùng trong Kho...',false);try{const r=await post({action:'checkKhoVanBanDuplicate',fileName:f.name,size:f.size});if(r.duplicated){SELECTED_DOC=r.document;setSource('KHO');document.getElementById('q').value=f.name.replace(/\.pdf$/i,'');renderSelected();return status('Văn bản này đã có trong Kho. Hệ thống đã chuyển sang dùng file gốc, không tải trùng.',true)}status('Chưa có trong Kho. File sẽ được đưa vào Kho khi thầy/cô bấm Phát hành.',false);document.getElementById('title').value=f.name.replace(/\.pdf$/i,'')}catch(e){status(e.message,true)}}
async function ensureDocument(){if(SOURCE==='KHO'){if(!SELECTED_DOC)throw new Error('Chưa chọn văn bản từ Kho HVA.');return SELECTED_DOC}const f=document.getElementById('pdfFile').files?.[0];if(!f)throw new Error('Chưa chọn PDF tải lên.');const data=await fileData(f);const r=await post({action:'uploadKhoVanBanNew',folderKey:document.getElementById('folderKey').value,fileName:f.name,base64Data:data,username:CURRENT_USER.username||'',fullName:CURRENT_USER.fullName||CURRENT_USER.hoTen||''});if(!r.success)throw new Error(r.message||'Không đưa được văn bản vào Kho.');SELECTED_DOC=r;renderSelected();return r}
async function loadRecipients(){const t=document.getElementById('recipientTeam').value,box=document.getElementById('recipientArea');PEOPLE=[];if(!t){box.textContent='Chọn Tổ/Bộ phận để tải danh sách.';return}box.textContent='Đang tải...';try{const r=await fetch(API+'?action=getNhanSuTheoTo&to='+encodeURIComponent(t)+'&_='+Date.now(),{cache:'no-store'});PEOPLE=unwrap(await r.json());box.innerHTML=PEOPLE.map((p,i)=>`<label class="person"><input class="pc" type="checkbox" data-i="${i}" checked> <span><b>${esc(p.hoTen||p.fullName||p.username)}</b> <span class="meta">${esc(p.vaiTro||p.chucVu||'')}</span></span></label>`).join('')||'Không có nhân sự.';document.getElementById('allPeople').checked=true}catch(e){box.textContent='Lỗi tải người nhận.'}}
function toggleAll(){document.querySelectorAll('.pc').forEach(x=>x.checked=document.getElementById('allPeople').checked)}
function recipients(){return [...document.querySelectorAll('.pc:checked')].map(x=>PEOPLE[Number(x.dataset.i)]).filter(Boolean)}
async function publishNow(){const btn=document.getElementById('publishBtn');btn.disabled=true;try{const target=document.getElementById('recipientTeam').value;if(!target)throw new Error('Chưa chọn Tổ/Bộ phận nhận.');const rec=recipients();if(!rec.length)throw new Error('Chưa chọn người nhận.');status('Đang chuẩn bị văn bản...',false);const d=await ensureDocument();const title=document.getElementById('title').value.trim()||d.tenVanBan||d.fileName||'Văn bản phát hành',msg=document.getElementById('message').value.trim()||'Đề nghị Thầy/Cô xem văn bản và thực hiện theo nội dung được ban hành/phát hành.';const id='PH-'+Date.now()+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const payload={action:'publishDocument',publishId:id,moduleSource:'BanHanhPhatHanh',documentType:document.getElementById('docType').value,sender:{username:CURRENT_USER.username||'',fullName:CURRENT_USER.fullName||CURRENT_USER.hoTen||'',workPosition:CURRENT_USER.workPosition||CURRENT_USER.chucVu||CURRENT_USER.vaiTro||'',department:teamOf(CURRENT_USER)},document:{docId:d.fileId||'',type:document.getElementById('docType').value,title,author:CURRENT_USER.fullName||CURRENT_USER.hoTen||'',data:{tieuDe:title,noiDung:msg,documentUrl:d.fileUrl||'',fileUrl:d.fileUrl||'',downloadUrl:d.downloadUrl||'',fileName:d.fileName||'',folderKey:d.folderKey||'',scope:SCOPE,issuerTeam:SCOPE==='TEAM'?document.getElementById('issuerTeam').value:'NHÀ TRƯỜNG',recipientTeam:target,schoolYear:document.getElementById('schoolYear').value}},recipients:rec,destinations:[{id:'ThongBao',name:'Thông báo'}]};status('Đang phát hành...',false);const rs=await post(payload);if(!rs.success)throw new Error(rs.message||'Backend không xác nhận phát hành.');status(`Đã phát hành thành công đến ${rs.recipientCount||rec.length} người. File gốc: ${d.fileName||title}`,false)}catch(e){status(e.message||String(e),true)}finally{btn.disabled=false}}
function renderSelected(){const b=document.getElementById('selectedDoc');if(!SELECTED_DOC){b.innerHTML='';return}b.innerHTML=`<div class="selected"><b>✓ Đã chọn:</b> ${esc(SELECTED_DOC.tenVanBan||SELECTED_DOC.fileName||'')} <span class="meta"> · ${esc(SELECTED_DOC.loaiKho||'')}</span> <button class="mini" onclick="previewSelected()">Mở</button> <button class="mini" onclick="openUrl('${js(SELECTED_DOC.downloadUrl||'')}')">Tải</button></div>`}
function previewSelected(){if(SELECTED_DOC?.fileUrl)return openUrl(SELECTED_DOC.fileUrl);if(SOURCE==='UPLOAD'){const f=document.getElementById('pdfFile').files?.[0];if(f)return window.open(URL.createObjectURL(f),'_blank')}status('Chưa chọn văn bản.',true)}
function openUrl(u){if(u)window.open(u,'_blank','noopener')}
function fileData(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function post(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return await r.json()}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function js(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
