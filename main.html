 <!DOCTYPE html>
<html lang="vi" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F4C81">
    <link rel="manifest" href="manifest.json">
    <title>TTDHS_HVA - Trung tâm Điều hành số THPT Hòa Vang</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            deep: '#EBF1F6',
                            primary: '#FFFFFF',
                            accent: '#CBD5E1',
                            teal: '#0F4C81',
                            glow: '#0284C7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <style>
        /* Tinh chỉnh bổ sung độ tương phản, viền card và chữ */
        .backdrop-blur-md { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .backdrop-blur-xl { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        
        /* Tăng nhẹ shadow và thêm border trắng mờ tinh tế cho các thành phần thẻ card */
        .card-enhanced {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="h-full bg-brand-deep text-slate-900 overflow-x-hidden antialiased select-none">

    <!-- Background -->
    <div class="fixed inset-0 -z-50 overflow-hidden bg-[#EBF1F6]">
        <div class="absolute -top-[15%] -left-[5%] w-[65%] h-[45%] rounded-full bg-sky-400/10 blur-[50px]"></div>
        <div class="absolute top-[35%] -right-[15%] w-[75%] h-[55%] rounded-full bg-blue-400/8 blur-[60px]"></div>
    </div>

    <div id="app" class="flex flex-col min-h-screen">

        <!-- ================= HEADER ================= -->
        <header class="fixed top-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-300/80 px-4 py-3 safe-pt flex items-center justify-between shadow-[0_1px_4px_rgba(0,0,0,0.06)]">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-teal to-blue-600 p-0.5 shadow-md shadow-brand-teal/20 flex items-center justify-center">
                    <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
                        <span class="text-brand-teal font-extrabold text-sm tracking-widest">HVA</span>
                    </div>
                </div>
                <div>
                    <h1 class="text-[10px] font-extrabold text-slate-600 uppercase tracking-widest leading-none">Trung tâm Điều hành số</h1>
                    <p class="text-sm font-extrabold text-slate-900 tracking-tight mt-0.5">Trường THPT Hòa Vang</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-notification" class="relative w-9 h-9 rounded-full bg-slate-100 border border-slate-300/80 flex items-center justify-center hover:bg-slate-200/80 transition shadow-sm">
                    <i class="bi bi-bell text-slate-800"></i>
                    <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-500 text-[10px] font-bold text-white flex items-center justify-center shadow-sm">3</span>
                </button>
                <button id="btn-ai" class="w-9 h-9 rounded-full bg-sky-50 border border-sky-300/80 flex items-center justify-center hover:bg-sky-100 active:scale-95 transition-all shadow-sm" title="Trợ lý AI">
                    <i class="bi bi-mic-fill text-brand-glow"></i>
                </button>
                <button id="btn-profile" class="w-9 h-9 rounded-full bg-slate-100 border border-slate-300/80 flex items-center justify-center hover:bg-slate-200/80 transition shadow-sm">
                    <i class="bi bi-person-fill text-slate-800"></i>
                </button>
            </div>
        </header>

        <!-- ================= MAIN CONTENT ================= -->
        <main id="main-content" class="flex-1 px-4 pt-24 safe-pb overflow-y-auto max-w-[460px] mx-auto w-full">
            <!-- Home content sẽ được render bởi HomeRenderer -->
            <div id="home-view"></div>
        </main>

        <!-- ================= MODULE CONTAINER ================= -->
        <div id="module-container" class="fixed inset-0 z-50 hidden" aria-hidden="true"></div>

        <!-- ================= BOTTOM NAV ================= -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-xl border-t border-slate-300/80 pb-safe px-6 shadow-[0_-4px_25px_rgba(0,0,0,0.1)]">
            <div class="flex items-center justify-between h-16 max-w-[460px] mx-auto">
                <a href="#" data-nav="home" class="nav-item flex flex-col items-center justify-center flex-1 text-brand-teal py-1 font-bold">
                    <i class="bi bi-house-door-fill text-xl drop-shadow-sm"></i>
                    <span class="text-[10px] font-extrabold mt-1">Trang chủ</span>
                </a>
                <a href="#" data-nav="contact" class="nav-item flex flex-col items-center justify-center flex-1 text-slate-500 hover:text-slate-900 py-1 transition">
                    <i class="bi bi-telephone-fill text-lg"></i>
                    <span class="text-[10px] font-semibold mt-1">Liên hệ</span>
                </a>
                <a href="#" data-nav="ai" class="nav-item flex flex-col items-center justify-center flex-1 text-slate-500 hover:text-slate-900 py-1 transition">
                    <i class="bi bi-cpu-fill text-lg"></i>
                    <span class="text-[10px] font-semibold mt-1">Trí tuệ AI</span>
                </a>
                <a href="#" data-nav="profile" class="nav-item flex flex-col items-center justify-center flex-1 text-slate-500 hover:text-slate-900 py-1 transition">
                    <i class="bi bi-person-lines-fill text-lg"></i>
                    <span class="text-[10px] font-semibold mt-1">Hồ sơ số</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- ================= GLOBAL OVERLAY (1 duy nhất) ================= -->
    <div id="global-overlay" class="fixed inset-0 z-[60] bg-black/40 backdrop-blur-sm hidden-force" aria-hidden="true"></div>

    <!-- ================= TOAST ================= -->
    <div id="toast-message" class="hidden-force fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] px-4 py-3 rounded-xl bg-slate-900/95 border border-slate-700 backdrop-blur-md shadow-2xl flex items-center space-x-2.5 text-xs text-white max-w-xs w-full justify-between transition-all duration-300">
        <div class="flex items-center space-x-2">
            <i class="bi bi-info-circle text-brand-glow text-base"></i>
            <span id="toast-text"></span>
        </div>
        <button id="toast-close" class="text-slate-400 hover:text-white"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- ================= LOADING OVERLAY ================= -->
    <div id="loading-overlay" class="fixed inset-0 z-[80] bg-black/50 backdrop-blur-sm flex items-center justify-center hidden-force">
        <div class="flex flex-col items-center gap-3">
            <div class="w-12 h-12 border-4 border-brand-glow/30 border-t-brand-glow rounded-full animate-spin"></div>
            <span class="text-white text-sm font-medium">Đang tải...</span>
        </div>
    </div>

    <!-- ================= AI MODAL (giữ nguyên UI) ================= -->
    <div id="ai-modal" class="fixed inset-0 z-50 hidden-force flex items-center justify-center bg-black/60 backdrop-blur-sm p-5">
        <div class="w-full max-w-md rounded-3xl bg-slate-900 border border-slate-700 shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-700">
                <h2 class="text-xl font-bold text-brand-glow flex items-center gap-2">
                    <i class="bi bi-mic-fill"></i> Trợ lý AI
                </h2>
                <p class="text-slate-400 text-sm mt-1">Hãy nói hoặc nhập yêu cầu của bạn.</p>
            </div>
            <div class="p-5 space-y-4">
                <button class="w-full py-4 rounded-2xl bg-brand-glow/20 border border-brand-glow/40 hover:bg-brand-glow/30 transition text-white font-medium">🎙️ Nói với Trợ lý AI</button>
                <textarea rows="4" placeholder="Ví dụ:&#10;Mở lịch công tác tuần&#10;Mở công văn 3293&#10;Tạo thông báo..." class="w-full rounded-2xl bg-slate-800 border border-slate-700 p-4 text-sm text-white resize-none outline-none focus:border-brand-glow transition"></textarea>
                <button class="w-full py-3 rounded-xl bg-brand-teal font-semibold text-white hover:opacity-90 shadow-lg">Gửi yêu cầu</button>
            </div>
            <div class="px-5 py-3 border-t border-slate-700 text-center">
                <button data-close-modal="ai-modal" class="text-slate-400 hover:text-white text-sm">Đóng</button>
            </div>
        </div>
    </div>

    <!-- ================= BOIDUONG MODAL (giữ nguyên UI) ================= -->
    <div id="boiduong-modal" class="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4 bg-black/40 backdrop-blur-sm hidden-force transition-all duration-300">
        <div class="bg-white border-0 sm:border border-slate-200 w-full h-full sm:h-auto sm:max-w-sm rounded-none sm:rounded-2xl p-5 shadow-2xl relative max-h-full sm:max-h-[90vh] overflow-y-auto flex flex-col justify-start text-slate-800">
            <button data-close-modal="boiduong-modal" class="absolute top-4 left-4 text-slate-600 hover:text-slate-900 p-1.5 rounded-lg hover:bg-slate-100 transition-all flex items-center gap-1">
                <i class="bi bi-arrow-left text-2xl"></i>
            </button>
            <div class="flex items-center space-x-3 mb-5 border-b border-slate-100 pb-4 pt-1 pl-10">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0 shadow-md">
                    <i class="bi bi-mortarboard-fill text-white text-xl"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-900 text-base leading-tight">Bồi dưỡng chuyên môn</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Sinh hoạt, tập huấn, hội thảo, hội nghị, bồi dưỡng</p>
                </div>
            </div>
            <div class="space-y-3" id="boiduong-menu">
                <!-- Nội dung menu được giữ nguyên, bind event qua JS -->
            </div>
        </div>
    </div>

  <!-- Scripts -->
<script src="services/api.js"></script>
<script type="module" src="assets/js/core/app.js"></script>

<!-- ĐOẠN GẮN KẾT SỰ KIỆN GIAO VIỆC -->
<script>
document.addEventListener("click", async function(event) {
    // Bắt đúng nút Giao việc có ID đã định nghĩa trên HTML
    const btn = event.target.closest('#btnGiaoViecNet');
    if (!btn) return;

    console.log("Đã bấm nút Giao việc!");

    // Thử gọi hàm API lưu dữ liệu (thầy có thể điều chỉnh dữ liệu mẫu bên dưới)
    try {
        const taskData = {
            tieuDe: "Nhiệm vụ mới từ hệ thống",
            noiDung: "Đồng bộ giao việc tự động",
            nguoiGiao: "Thầy Nguyễn Văn Thả"
        };
        const assignees = [{ username: "to.toan", hoTen: "Tổ Toán", vaiTro: "Chủ trì" }];

        const ketQua = await apiCreateTask(taskData, assignees);
        if (ketQua && ketQua.status === "success") {
            alert("Đã giao việc thành công xuống Google Sheets!");
        }
    } catch (error) {
        console.error("Lỗi khi gọi API:", error);
    }
});
</script>
</body>
</html>
